<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 336" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#fff"/>
  <defs>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0,0 10,5 0,10" fill="#da4ada"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0,0 10,5 0,10" fill="#06bdad"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0,0 10,5 0,10" fill="#35b0e8"/></marker>
  </defs>

  <!-- End users -->
  <text x="20" y="58" font-size="14" fill="#da4ada" font-weight="bold" text-anchor="start" letter-spacing="1">END USERS</text>
  <rect x="20" y="68" width="165" height="85" rx="4" fill="#ffeaff" stroke="#da4ada" stroke-width="1.5"/>
  <text x="102.5" y="102" font-size="24" fill="#212529" font-weight="bold" text-anchor="middle">200,000</text>
  <text x="102.5" y="124" font-size="14" fill="#6c757d" text-anchor="middle">people a day</text>
  <text x="102.5" y="142" font-size="14" fill="#6c757d" text-anchor="middle">clicking around</text>
  <text x="102.5" y="185" font-size="14" fill="#6c757d" text-anchor="middle" font-style="italic">(they don't know</text>
  <text x="102.5" y="203" font-size="14" fill="#6c757d" text-anchor="middle" font-style="italic">we exist)</text>

  <!-- Our customer: their app and their team -->
  <rect x="225" y="40" width="340" height="280" rx="8" fill="none" stroke="#da4ada" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="225" y="30" font-size="14" text-anchor="start"><tspan fill="#da4ada" font-weight="bold" letter-spacing="1">OUR CUSTOMER</tspan><tspan fill="#6c757d"> · one of 100 companies</tspan></text>
  <rect x="250" y="68" width="290" height="85" rx="4" fill="#ffeaff" stroke="#da4ada" stroke-width="1.5"/>
  <text x="395" y="104" font-size="18" fill="#212529" font-weight="bold" text-anchor="middle">Their app + our SDK</text>
  <text x="395" y="130" font-size="14" fill="#6c757d" text-anchor="middle">collects events, sends batches</text>
  <rect x="250" y="210" width="290" height="85" rx="4" fill="#e1f5fe" stroke="#35b0e8" stroke-width="1.5"/>
  <text x="395" y="246" font-size="18" fill="#212529" font-weight="bold" text-anchor="middle">Their team</text>
  <text x="395" y="272" font-size="14" fill="#6c757d" text-anchor="middle">~5 people who look at the charts</text>
  <text x="640" y="58" font-size="14" fill="#e6a000" font-weight="bold" text-anchor="start" letter-spacing="1">WE</text>
  <rect x="640" y="68" width="160" height="227" rx="4" fill="#ffed50" stroke="#e7d749" stroke-width="1.5"/>
  <text x="720" y="172" font-size="20" fill="#212529" font-weight="bold" text-anchor="middle">MyAnalytics</text>
  <text x="720" y="196" font-size="14" fill="#495057" text-anchor="middle">stores, counts,</text>
  <text x="720" y="214" font-size="14" fill="#495057" text-anchor="middle">draws charts</text>

  <!-- Arrows -->
  <line x1="185" y1="110" x2="248" y2="110" stroke="#da4ada" stroke-width="2" marker-end="url(#a-purple)"/>
  <line x1="540" y1="110" x2="638" y2="110" stroke="#06bdad" stroke-width="2.5" marker-end="url(#a-teal)"/>
  <text x="602" y="100" font-size="15" fill="#008378" font-weight="bold" text-anchor="middle">events</text>
  <line x1="640" y1="252" x2="542" y2="252" stroke="#35b0e8" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="602" y="242" font-size="15" fill="#0288d1" font-weight="bold" text-anchor="middle">charts</text>
</svg>
