<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 360" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#fff"/>
  <defs>

  </defs>
  <text x="80" y="28" font-size="18" fill="#212529" font-weight="bold" text-anchor="start">Size of the events table</text>
  <text x="80" y="48" font-size="14" fill="#6c757d" text-anchor="start">10 GB a day, if we stay at 100 customers</text>

  <!-- Grid lines and y axis -->
  <line x1="80" y1="240" x2="680" y2="240" stroke="#f0f0f0" stroke-width="1"/>
  <text x="70" y="245" font-size="14" fill="#6c757d" text-anchor="end">1 TB</text>
  <line x1="80" y1="180" x2="680" y2="180" stroke="#f0f0f0" stroke-width="1"/>
  <text x="70" y="185" font-size="14" fill="#6c757d" text-anchor="end">2 TB</text>
  <line x1="80" y1="120" x2="680" y2="120" stroke="#f0f0f0" stroke-width="1"/>
  <text x="70" y="125" font-size="14" fill="#6c757d" text-anchor="end">3 TB</text>
  <line x1="80" y1="60" x2="680" y2="60" stroke="#f0f0f0" stroke-width="1"/>
  <text x="70" y="65" font-size="14" fill="#6c757d" text-anchor="end">4 TB</text>
  <text x="70" y="305" font-size="14" fill="#6c757d" text-anchor="end">0</text>

  <!-- Areas and lines: red = keep everything, green = keep 90 days -->
  <polygon points="80,300 680,81.0 680,300" fill="#ffe6e6"/>
  <polygon points="80,300 227.9,246.0 680,246.0 680,300" fill="#d4edda"/>
  <line x1="227.9" y1="60" x2="227.9" y2="300" stroke="#9f9f9f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polyline points="80,300 680,81.0" fill="none" stroke="#fd456f" stroke-width="3" stroke-linecap="round"/>
  <polyline points="80,300 227.9,246.0 680,246.0" fill="none" stroke="#28a745" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="80" y1="300" x2="680" y2="300" stroke="#9f9f9f" stroke-width="1.5"/>
  <circle cx="680" cy="81.0" r="5" fill="#fd456f"/>
  <circle cx="680" cy="246.0" r="5" fill="#28a745"/>

  <!-- Labels -->
  <text x="692" y="83.0" font-size="20" fill="#e60038" font-weight="bold" text-anchor="start">3.6 TB</text>
  <text x="692" y="103.0" font-size="14" fill="#e60038" text-anchor="start">keep everything</text>
  <text x="692" y="248.0" font-size="20" fill="#28a745" font-weight="bold" text-anchor="start">~900 GB</text>
  <text x="692" y="268.0" font-size="14" fill="#28a745" text-anchor="start">keep 90 days</text>
  <text x="235.9" y="140" font-size="14" fill="#6c757d" text-anchor="start">day 90: each new day</text>
  <text x="235.9" y="158" font-size="14" fill="#6c757d" text-anchor="start">pushes out the oldest one</text>
  <text x="80.0" y="322" font-size="14" fill="#6c757d" text-anchor="middle">0</text>
  <text x="227.9" y="322" font-size="14" fill="#6c757d" text-anchor="middle">90</text>
  <text x="375.9" y="322" font-size="14" fill="#6c757d" text-anchor="middle">180</text>
  <text x="523.8" y="322" font-size="14" fill="#6c757d" text-anchor="middle">270</text>
  <text x="680.0" y="322" font-size="14" fill="#6c757d" text-anchor="middle">365</text>
  <text x="380.0" y="348" font-size="14" fill="#6c757d" text-anchor="middle">days</text>
</svg>
