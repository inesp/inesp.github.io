<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#fff"/>
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0,0 10,5 0,10" fill="#35b0e8"/></marker>
  </defs>
  <text x="20" y="26" font-size="14" text-anchor="start"><tspan fill="#0288d1" font-weight="bold" letter-spacing="1">READS</tspan><tspan fill="#6c757d"> · how much gets looked at</tspan></text>

  <!-- Boxes -->
  <rect x="20" y="44" width="140" height="90" rx="4" fill="#e1f5fe" stroke="#35b0e8" stroke-width="1.5"/>
  <text x="90.0" y="87" font-size="28" fill="#212529" font-weight="bold" text-anchor="middle">100</text>
  <text x="90.0" y="113" font-size="14" fill="#6c757d" text-anchor="middle">customers</text>
  <rect x="290" y="44" width="140" height="90" rx="4" fill="#e1f5fe" stroke="#35b0e8" stroke-width="1.5"/>
  <text x="360.0" y="87" font-size="28" fill="#212529" font-weight="bold" text-anchor="middle">500</text>
  <text x="360.0" y="113" font-size="14" fill="#6c757d" text-anchor="middle">people</text>
  <rect x="560" y="44" width="140" height="90" rx="4" fill="#e1f5fe" stroke="#35b0e8" stroke-width="1.5"/>
  <text x="630.0" y="87" font-size="28" fill="#212529" font-weight="bold" text-anchor="middle">10k</text>
  <text x="630.0" y="113" font-size="14" fill="#6c757d" text-anchor="middle">dashboards/day</text>
  <rect x="20" y="232" width="140" height="90" rx="4" fill="#ffed50" stroke="#e7d749" stroke-width="1.5"/>
  <text x="90.0" y="275" font-size="28" fill="#212529" font-weight="bold" text-anchor="middle">100k</text>
  <text x="90.0" y="301" font-size="14" fill="#495057" text-anchor="middle">queries/day</text>
  <rect x="290" y="232" width="140" height="90" rx="4" fill="#ffed50" stroke="#e7d749" stroke-width="1.5"/>
  <text x="360.0" y="275" font-size="28" fill="#212529" font-weight="bold" text-anchor="middle">≈ 1</text>
  <text x="360.0" y="301" font-size="14" fill="#495057" text-anchor="middle">query/s</text>

  <!-- Arrows -->
  <line x1="160" y1="89.0" x2="288" y2="89.0" stroke="#35b0e8" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="224.0" y="79.0" font-size="14" fill="#0288d1" font-weight="bold" text-anchor="middle">× 5 people</text>
  <line x1="430" y1="89.0" x2="558" y2="89.0" stroke="#35b0e8" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="494.0" y="79.0" font-size="14" fill="#0288d1" font-weight="bold" text-anchor="middle">× 20 dashboards</text>
  <line x1="160" y1="277.0" x2="288" y2="277.0" stroke="#35b0e8" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <text x="224.0" y="267.0" font-size="14" fill="#0288d1" font-weight="bold" text-anchor="middle">÷ 86,400 s</text>
  <path d="M630.0,134 V180 H90.0 V230" fill="none" stroke="#35b0e8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#a-blue)"/>
  <text x="360.0" y="171" font-size="14" fill="#0288d1" font-weight="bold" text-anchor="middle">× 10 charts, and 1 chart = 1 SQL query</text>
</svg>
