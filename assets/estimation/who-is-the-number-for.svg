<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#9f9f9f"/></marker>
  </defs>

  <!-- Title -->
  <text x="230.0" y="20" text-anchor="middle" font-weight="bold" font-size="11px" fill="#212529">Who is this number for?</text>
  <rect x="155" y="38" width="150" height="30" rx="4" fill="#35b0e8"/>
  <text x="230.0" y="56.5" text-anchor="middle" font-size="10px" font-weight="bold" fill="#fff">How long will it take?</text>
  <!-- Connector: down from the question, then split into 3 -->
  <line x1="230" y1="68" x2="230" y2="80" stroke="#9f9f9f" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="380" y2="80" stroke="#9f9f9f" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="92" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="96" width="120" height="40" rx="4" fill="#e6a000"/>
  <text x="80.0" y="113.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">Do we start</text>
  <text x="80.0" y="125.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">the project at all?</text>
  <line x1="80" y1="136" x2="80" y2="154" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="158" width="120" height="40" rx="4" fill="#06bdad"/>
  <text x="80.0" y="175.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">2 weeks or</text>
  <text x="80.0" y="187.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">6 months?</text>
  <line x1="230" y1="80" x2="230" y2="92" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="170" y="96" width="120" height="40" rx="4" fill="#e6a000"/>
  <text x="230.0" y="113.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">Which release</text>
  <text x="230.0" y="125.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">date do we pick?</text>
  <line x1="230" y1="136" x2="230" y2="154" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="170" y="158" width="120" height="40" rx="4" fill="#06bdad"/>
  <text x="230.0" y="175.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">a date range</text>
  <text x="230.0" y="187.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">+ the risks</text>
  <line x1="380" y1="80" x2="380" y2="92" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="320" y="96" width="120" height="40" rx="4" fill="#e6a000"/>
  <text x="380.0" y="113.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">What do we tell</text>
  <text x="380.0" y="125.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">the customer?</text>
  <line x1="380" y1="136" x2="380" y2="154" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="320" y="158" width="120" height="40" rx="4" fill="#06bdad"/>
  <text x="380.0" y="175.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">a date we</text>
  <text x="380.0" y="187.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">can promise</text>
</svg>
