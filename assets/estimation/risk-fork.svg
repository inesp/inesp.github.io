<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#9f9f9f"/></marker>
  </defs>

  <!-- Title -->
  <text x="230.0" y="20" text-anchor="middle" font-weight="bold" font-size="11px" fill="#212529">Instead of a date: where is the risk?</text>

  <!-- Fork 1 -->
  <polygon points="120,40 200,82 120,124 40,82" fill="#e6a000"/>
  <text x="120" y="80" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">API does what</text>
  <text x="120" y="92" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">the docs say?</text>
  <line x1="80" y1="105" x2="62" y2="146" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="105" x2="178" y2="146" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="62" y="126" text-anchor="end" font-size="8px" font-weight="bold" fill="#00a89a">yes</text>
  <text x="178" y="126" font-size="8px" font-weight="bold" fill="#fd456f">no</text>
  <rect x="12" y="150" width="86" height="34" rx="4" fill="#06bdad"/>
  <text x="55.0" y="170.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">quick</text>
  <rect x="142" y="150" width="86" height="34" rx="4" fill="#fd456f"/>
  <text x="185.0" y="170.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">might get messy</text>

  <!-- Fork 2 -->
  <polygon points="340,40 420,82 340,124 260,82" fill="#e6a000"/>
  <text x="340" y="80" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">migration runs in</text>
  <text x="340" y="92" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">seconds on prod?</text>
  <line x1="300" y1="105" x2="282" y2="146" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="105" x2="398" y2="146" stroke="#9f9f9f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="282" y="126" text-anchor="end" font-size="8px" font-weight="bold" fill="#00a89a">yes</text>
  <text x="398" y="126" font-size="8px" font-weight="bold" fill="#fd456f">no</text>
  <rect x="232" y="150" width="86" height="34" rx="4" fill="#06bdad"/>
  <text x="275.0" y="170.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">quick</text>
  <rect x="362" y="150" width="86" height="34" rx="4" fill="#fd456f"/>
  <text x="405.0" y="164.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">locks 200M rows:</text>
  <text x="405.0" y="176.2" text-anchor="middle" font-size="9px" font-weight="bold" fill="#fff">might get messy</text>
</svg>
