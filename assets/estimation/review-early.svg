<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 175" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#fff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#9f9f9f"/></marker>
  </defs>

  <!-- Title -->
  <text x="230.0" y="20" text-anchor="middle" font-weight="bold" font-size="11px" fill="#212529">When do we first review the work?</text>

  <!-- in iterations -->
  <text x="98" y="74" text-anchor="end" font-size="10px" font-weight="bold" fill="#06bdad">in iterations</text>
  <line x1="110" y1="70" x2="440" y2="70" stroke="#dadada" stroke-width="3" stroke-linecap="round"/>
  <circle cx="137.5" cy="70" r="6" fill="#06bdad"/>
  <circle cx="165.0" cy="70" r="6" fill="#06bdad"/>
  <circle cx="192.5" cy="70" r="6" fill="#06bdad"/>
  <circle cx="220.0" cy="70" r="6" fill="#06bdad"/>
  <circle cx="247.5" cy="70" r="6" fill="#06bdad"/>
  <circle cx="275.0" cy="70" r="6" fill="#06bdad"/>
  <circle cx="302.5" cy="70" r="6" fill="#06bdad"/>
  <circle cx="330.0" cy="70" r="6" fill="#06bdad"/>
  <circle cx="357.5" cy="70" r="6" fill="#06bdad"/>
  <circle cx="385.0" cy="70" r="6" fill="#06bdad"/>
  <circle cx="412.5" cy="70" r="6" fill="#06bdad"/>
  <circle cx="440.0" cy="70" r="6" fill="#06bdad"/>

  <!-- all at once -->
  <text x="98" y="134" text-anchor="end" font-size="10px" font-weight="bold" fill="#fd456f">all at once</text>
  <line x1="110" y1="130" x2="440" y2="130" stroke="#dadada" stroke-width="3" stroke-linecap="round"/>
  <circle cx="440.0" cy="130" r="6" fill="#fd456f"/>
  <text x="275.0" y="96" text-anchor="middle" font-size="8px" fill="#6c757d">review every few days, change course early</text>
  <text x="430" y="156" text-anchor="end" font-size="8px" fill="#6c757d">first look after weeks</text>
  <text x="110" y="48" font-size="8px" fill="#6c757d">start</text>
  <text x="440" y="48" text-anchor="end" font-size="8px" fill="#6c757d">3 months</text>
</svg>
