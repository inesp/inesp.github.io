<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 114" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="114" fill="#fff"/>
  <text x="10" y="14" font-size="11" fill="#212529" font-weight="bold">Who @-mentioned me in Slack</text>
  <!-- Legend -->
  <rect x="10" y="22" width="9" height="9" rx="2" fill="#35b0e8"/><text x="23" y="30" font-size="9" fill="#212529">bots</text>
  <rect x="57" y="22" width="9" height="9" rx="2" fill="#ff7898"/><text x="70" y="30" font-size="9" fill="#212529">bosses</text>
  <rect x="114" y="22" width="9" height="9" rx="2" fill="#06bdad"/><text x="127" y="30" font-size="9" fill="#212529">devs</text>
  <rect x="161" y="22" width="9" height="9" rx="2" fill="#ffcf65"/><text x="174" y="30" font-size="9" fill="#212529">other people</text>
  <!-- humans -->
  <text x="74" y="52" font-size="9" fill="#212529" text-anchor="end">humans</text>
  <rect x="80.0" y="42" width="134.2" height="12" rx="2" fill="#ff7898"/>
  <rect x="214.2" y="42" width="184.4" height="12" rx="2" fill="#06bdad"/>
  <rect x="398.6" y="42" width="36.6" height="12" rx="2" fill="#ffcf65"/>
  <text x="147.2" y="51" font-size="8" fill="#212529" font-weight="bold" text-anchor="middle">38%</text>
  <text x="306.4" y="51" font-size="8" fill="#212529" font-weight="bold" text-anchor="middle">52%</text>
  <text x="417.0" y="51" font-size="8" fill="#212529" font-weight="bold" text-anchor="middle">10%</text>
  <text x="442.6" y="52" font-size="9" fill="#212529" font-weight="bold">2,390  <tspan font-weight="normal" fill="#6c757d">· 1.4 a day</tspan></text>
  <!-- GitHub bot -->
  <text x="74" y="69" font-size="9" fill="#212529" text-anchor="end">GitHub bot</text>
  <rect x="80.0" y="59" width="276.8" height="12" rx="2" fill="#35b0e8"/>
  <text x="364.2" y="69" font-size="9" fill="#212529" font-weight="bold">1,862  <tspan font-weight="normal" fill="#6c757d">· 1.1 a day</tspan></text>
  <!-- other bots -->
  <text x="74" y="86" font-size="9" fill="#212529" text-anchor="end">other bots</text>
  <rect x="80.0" y="76" width="63.9" height="12" rx="2" fill="#35b0e8"/>
  <text x="151.3" y="86" font-size="9" fill="#212529" font-weight="bold">430  <tspan font-weight="normal" fill="#6c757d">· 0.3 a day</tspan></text>
  <!-- incident bots -->
  <text x="74" y="103" font-size="9" fill="#212529" text-anchor="end">incident bots</text>
  <rect x="80.0" y="93" width="36.9" height="12" rx="2" fill="#35b0e8"/>
  <text x="124.3" y="103" font-size="9" fill="#212529" font-weight="bold">248  <tspan font-weight="normal" fill="#6c757d">· 0.1 a day</tspan></text>
</svg>
