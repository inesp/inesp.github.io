<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 206" font-family="system-ui, -apple-system, sans-serif">
  <!-- Bricolage Grotesque 800, subset to the digits used here -->
  <defs><style>@font-face{font-family:"BricoNum";font-weight:800;src:url(data:font/woff2;base64,) format("woff2")} .num{font-family:"BricoNum","Bricolage Grotesque",system-ui,sans-serif;font-weight:800}</style></defs>
  <rect width="520" height="206" fill="#fff"/>
  <!-- years, Feb 2020 to Nov 2026 -->
  <text class="num" x="4.0" y="36.0" font-size="30" fill="#212529">6¾</text>
  <text x="4.0" y="54.0" font-size="10.5" fill="#6c757d">years, Feb 2020 to Nov 2026</text>
  <!-- days with a commit (75%) -->
  <text class="num" x="177.3" y="36.0" font-size="30" fill="#212529">1,332</text>
  <text x="177.3" y="54.0" font-size="10.5" fill="#6c757d">days with a commit (75%)</text>
  <!-- merged PRs -->
  <text class="num" x="350.7" y="36.0" font-size="30" fill="#212529">3,103</text>
  <text x="350.7" y="54.0" font-size="10.5" fill="#6c757d">merged PRs</text>
  <!-- commits -->
  <text class="num" x="4.0" y="102.0" font-size="30" fill="#212529">9,719</text>
  <text x="4.0" y="120.0" font-size="10.5" fill="#6c757d">commits</text>
  <!-- of my lines still running -->
  <text class="num" x="177.3" y="102.0" font-size="30" fill="#212529">239k</text>
  <text x="177.3" y="120.0" font-size="10.5" fill="#6c757d">of my lines still running</text>
  <!-- median time to merge a PR -->
  <text class="num" x="350.7" y="102.0" font-size="30" fill="#212529">2.4 h</text>
  <text x="350.7" y="120.0" font-size="10.5" fill="#6c757d">median time to merge a PR</text>
  <!-- colleagues' PRs reviewed -->
  <text class="num" x="4.0" y="168.0" font-size="30" fill="#212529">4,531</text>
  <text x="4.0" y="186.0" font-size="10.5" fill="#6c757d">colleagues' PRs reviewed</text>
  <!-- Confluence pages written -->
  <text class="num" x="177.3" y="168.0" font-size="30" fill="#212529">73</text>
  <text x="177.3" y="186.0" font-size="10.5" fill="#6c757d">Confluence pages (co-)written</text>
  <!-- projects led -->
  <text class="num" x="350.7" y="168.0" font-size="30" fill="#212529">44</text>
  <text x="350.7" y="186.0" font-size="10.5" fill="#6c757d">projects led</text>
</svg>
