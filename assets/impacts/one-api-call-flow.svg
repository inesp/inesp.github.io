<svg viewBox="0 0 500 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="500" height="240" fill="#fff"/>
  <defs><marker id="arrow-ink" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><polygon points="0,0 4,2 0,4" fill="#212529"/></marker><marker id="arrow-green" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><polygon points="0,0 4,2 0,4" fill="#28a745"/></marker></defs>

  <!-- Clock: every 2 minutes -->
  <circle cx="40" cy="62" r="17" fill="#fff" stroke="#212529" stroke-width="1.5"/>
  <line x1="40" y1="62" x2="40" y2="51" stroke="#212529" stroke-width="1.5"/>
  <line x1="40" y1="62" x2="48" y2="66" stroke="#212529" stroke-width="1.5"/>
  <text x="40" y="96" font-size="9" fill="#6c757d" text-anchor="middle">every 2 min</text>
  <line x1="60" y1="62" x2="92" y2="62" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow-ink)"/>

  <!-- Impacts -->
  <rect x="98" y="38" width="100" height="48" fill="#d4edda" rx="4" stroke="#28a745" stroke-width="1.5"/>
  <text x="148" y="60" font-size="11" fill="#28a745" font-weight="bold" text-anchor="middle">Impacts</text>
  <text x="148" y="74" font-size="8" fill="#6c757d" text-anchor="middle">1 metric</text>

  <!-- Request: 1 API call -->
  <line x1="198" y1="50" x2="326" y2="50" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <text x="262" y="43" font-size="9" fill="#212529" text-anchor="middle">1 API call</text>

  <!-- Response: 1 value back (yellow chip) -->
  <line x1="332" y1="76" x2="204" y2="76" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
  <rect x="244" y="68" width="36" height="16" fill="#ffed50" rx="4" stroke="#e7d749" stroke-width="1.5"/>
  <text x="262" y="79.5" font-size="9" fill="#212529" font-weight="bold" text-anchor="middle">0.42</text>
  <text x="262" y="97" font-size="9" fill="#212529" text-anchor="middle">1 value back</text>

  <!-- Providers -->
  <rect x="336" y="26" width="120" height="19" fill="#fff" rx="4" stroke="#212529" stroke-width="1.5"/>
  <text x="396" y="39" font-size="9" fill="#212529" text-anchor="middle">Datadog</text>
  <rect x="336" y="50" width="120" height="19" fill="#fff" rx="4" stroke="#212529" stroke-width="1.5"/>
  <text x="396" y="63" font-size="9" fill="#212529" text-anchor="middle">Sentry</text>
  <rect x="336" y="74" width="120" height="19" fill="#fff" rx="4" stroke="#212529" stroke-width="1.5"/>
  <text x="396" y="87" font-size="9" fill="#212529" text-anchor="middle">AWS CloudWatch</text>
  <text x="396" y="104" font-size="12" fill="#212529" font-weight="bold" text-anchor="middle">...</text>

  <!-- Append: Impacts -> newest point -->
  <path d="M148 86 V124 H452 V167" fill="none" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="300" y="119" font-size="9" fill="#28a745" font-weight="bold" text-anchor="middle">append to the timeseries</text>

  <!-- Timeseries: one dot every 2 min -->
  <line x1="40" y1="160" x2="466" y2="160" stroke="#dadada" stroke-width="0.5"/>
  <line x1="40" y1="187" x2="466" y2="187" stroke="#dadada" stroke-width="0.5"/>
  <line x1="40" y1="214" x2="466" y2="214" stroke="#212529" stroke-width="1.5"/>
  <polygon points="476,214 466,210 466,218" fill="#212529"/>
  <line x1="40" y1="150" x2="40" y2="214" stroke="#212529" stroke-width="1.5"/>
  <circle cx="50.0" cy="177.2" r="2.5" fill="#ffed50" stroke="#e7d749" stroke-width="0.8"/>
