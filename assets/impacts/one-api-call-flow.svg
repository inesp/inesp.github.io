  <circle cx="218.0" cy="176.1" r="2.5" fill="#ffed50" stroke="#e7d749" stroke-width="0.8"/>
  <circle cx="232.0" cy="174.9" r="2.5" fill="#ffed50" stroke="#e7d749" stroke-width="0.8"/>
