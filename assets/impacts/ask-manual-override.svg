<svg viewBox="0 0 440 190" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="440" height="190" fill="#fff"/>
  <text x="20" y="24" font-size="13" fill="#212529" font-weight="bold">Health by team</text>

  <!-- Team: Payments -->
  <text x="20" y="58" font-size="11" fill="#212529">Payments</text>
  <rect x="110" y="45" width="92" height="20" fill="#d4edda" rx="4" stroke="#28a745" stroke-width="1.2"/>
  <text x="156.0" y="59" font-size="10" fill="#28a745" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">HEALTHY</text>

  <!-- Team: Search -->
  <text x="20" y="92" font-size="11" fill="#212529">Search</text>
  <rect x="110" y="79" width="92" height="20" fill="#fff8cd" rx="4" stroke="#e7d749" stroke-width="1.2"/>
  <text x="156.0" y="93" font-size="10" fill="#e6a000" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">AILING</text>

  <!-- Team: Mobile -->
