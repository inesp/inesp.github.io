  <text x="156.0" y="127" font-size="10" fill="#fd456f" font-weight="bold" text-anchor="middle" letter-spacing="0.05em">UNHEALTHY</text>
  <line x1="116" y1="123" x2="196" y2="123" stroke="#212529" stroke-width="1.5"/>
  <path d="M210 123 h22" stroke="#212529" stroke-width="1.3"/>
  <path d="M232 123 l-6 -4 l0 8 z" fill="#212529"/>
  <rect x="240" y="113" width="92" height="20" fill="#d4edda" rx="4" stroke="#28a745" stroke-width="1.2"/>
