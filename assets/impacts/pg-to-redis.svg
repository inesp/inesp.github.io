<svg viewBox="0 0 560 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="560" height="262" fill="#fff"/>

  <!-- BEFORE: one Postgres row per source, every 2 minutes -->
  <text x="15" y="24" font-size="12" font-weight="bold" fill="#fd456f">Before: Postgres</text>
  <text x="15" y="38" font-size="9" fill="#6c757d">table impact, 1 row every 2 min</text>
