    <text x="58" y="135.5" font-size="8" fill="#212529">10:02</text>
    <text x="120" y="135.5" font-size="8" fill="#212529">97</text>
    <text x="160" y="135.5" font-size="8" fill="#fd456f">unhealthy</text>
