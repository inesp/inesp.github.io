  <text x="410.0" y="150.5" font-size="8" fill="#212529" text-anchor="middle">15</text>
  <line x1="410.0" y1="126" x2="433.8" y2="92" stroke="#fd456f" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="433.8" cy="92" r="1.6" fill="#fd456f"/>
  <rect x="419" y="140" width="18" height="15" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="428.0" y="150.5" font-size="8" fill="#212529" text-anchor="middle">16</text>
  <line x1="428.0" y1="126" x2="444.2" y2="92" stroke="#fd456f" stroke-width="1" stroke-dasharray="2,2"/>
