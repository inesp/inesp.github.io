  <text x="284" y="227" font-size="10" fill="#212529">fixed length: old values fall off by themselves</text>
  <polyline points="271,240 274,243 279,236" fill="none" stroke="#28a745" stroke-width="1.8"/>
  <text x="284" y="244" font-size="10" fill="#212529">1 round trip reads all 28 days</text>
