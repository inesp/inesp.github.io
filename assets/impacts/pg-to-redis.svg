    <text x="58" y="90.5" font-size="8" fill="#212529">10:02</text>
    <text x="120" y="90.5" font-size="8" fill="#212529">0.23</text>
    <text x="160" y="90.5" font-size="8" fill="#28a745">healthy</text>
  </g>
  <g opacity="0.82">
