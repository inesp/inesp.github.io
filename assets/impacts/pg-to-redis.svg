    <text x="120" y="180.5" font-size="8" fill="#212529">310</text>
    <text x="160" y="180.5" font-size="8" fill="#28a745">healthy</text>
  </g>
  <g opacity="0.28">
    <rect x="15" y="185" width="200" height="15" fill="#fff" stroke="#dadada" stroke-width="1"/>
    <text x="20" y="195.5" font-size="8" fill="#212529">42</text>
