  <!-- The rest: usually empty -->
  <text x="271" y="182" font-size="9" fill="#6c757d">_meta { last_change }</text>

  <!-- Why it was so much better -->
  <polyline points="271,206 274,209 279,202" fill="none" stroke="#28a745" stroke-width="1.8"/>
  <text x="284" y="210" font-size="10" fill="#212529">a few keys per source, not millions of rows</text>
