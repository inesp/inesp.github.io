  <text x="120" y="60.5" font-size="8" font-weight="bold" fill="#212529">value</text>
  <text x="160" y="60.5" font-size="8" font-weight="bold" fill="#212529">health</text>
  <!-- Rows fade out: the table never ends -->
  <g opacity="1.00">
    <rect x="15" y="65" width="200" height="15" fill="#fff" stroke="#dadada" stroke-width="1"/>
    <text x="20" y="75.5" font-size="8" fill="#212529">42</text>
