  <circle cx="115.0" cy="220" r="1.1" fill="#6c757d"/>
  <circle cx="115.0" cy="224" r="1.1" fill="#6c757d"/>
  <circle cx="115.0" cy="228" r="1.1" fill="#6c757d"/>
  <text x="115.0" y="245" font-size="10" font-weight="bold" fill="#fd456f" text-anchor="middle">+720 rows per source per day</text>
  <text x="115.0" y="258" font-size="9" fill="#6c757d" text-anchor="middle">until the DB ran out of IOPS (2021)</text>

  <!-- Arrow: we moved -->
  <line x1="227" y1="140" x2="249" y2="140" stroke="#212529" stroke-width="1.5"/>
  <polygon points="257,140 247,136 247,144" fill="#212529"/>

