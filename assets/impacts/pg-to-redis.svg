    <text x="20" y="120.5" font-size="8" fill="#212529">43</text>
    <text x="58" y="120.5" font-size="8" fill="#212529">10:00</text>
    <text x="120" y="120.5" font-size="8" fill="#212529">12</text>
    <text x="160" y="120.5" font-size="8" fill="#28a745">healthy</text>
  </g>
  <g opacity="0.64">
    <rect x="15" y="125" width="200" height="15" fill="#fff" stroke="#dadada" stroke-width="1"/>
