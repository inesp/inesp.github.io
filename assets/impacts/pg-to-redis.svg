    <text x="120" y="75.5" font-size="8" fill="#212529">0.21</text>
    <text x="160" y="75.5" font-size="8" fill="#28a745">healthy</text>
  </g>
  <g opacity="0.91">
    <rect x="15" y="80" width="200" height="15" fill="#fff" stroke="#dadada" stroke-width="1"/>
