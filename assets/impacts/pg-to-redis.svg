  <rect x="386.5" y="72" width="10.5" height="18" fill="#ffed50" stroke="#e6a000" stroke-width="1.8"/>
  <rect x="397.0" y="72" width="10.5" height="18" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="407.5" y="72" width="10.5" height="18" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="418.0" y="72" width="10.5" height="18" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="428.5" y="72" width="10.5" height="18" fill="#ffed50" stroke="#fd456f" stroke-width="1.8"/>
  <rect x="439.0" y="72" width="10.5" height="18" fill="#ffed50" stroke="#fd456f" stroke-width="1.8"/>
