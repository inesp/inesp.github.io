<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="560" height="300" fill="#fff"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#212529"/></marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fd456f"/></marker>
  </defs>

  <!-- Title -->
  <text x="280.0" y="20" text-anchor="middle" font-size="12" fill="#212529" font-weight="bold">One queue, filling faster than it empties</text>
  <text x="280.0" y="35" text-anchor="middle" font-size="8.5" fill="#6c757d">every job is one API call; the front of the queue runs next</text>

  <!-- New jobs come in -->
  <line x1="14" y1="151.0" x2="90" y2="151.0" stroke="#212529" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="14" y="135.0" font-size="8.5" fill="#212529" font-weight="bold">every 2 min</text>
  <text x="14" y="145.0" font-size="8" fill="#6c757d">2,000 new jobs</text>

  <!-- The queue -->
  <rect x="96" y="136" width="284" height="30" rx="6" fill="none" stroke="#212529" stroke-width="1.5"/>
  <g>
    <rect x="354.0" y="141.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="364.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">DD</text>
  </g>
  <g>
    <rect x="331.0" y="141.0" width="20" height="20" rx="3" fill="#fd456f"/>
    <text x="341.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">S</text>
  </g>
  <g>
    <rect x="308.0" y="141.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="318.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">NR</text>
  </g>
  <g>
    <rect x="285.0" y="141.0" width="20" height="20" rx="3" fill="#fd456f"/>
    <text x="295.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">DD</text>
  </g>
  <g>
    <rect x="262.0" y="141.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="272.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">CW</text>
  </g>
  <g>
    <rect x="239.0" y="141.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="249.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">S</text>
  </g>
  <g>
    <rect x="216.0" y="141.0" width="20" height="20" rx="3" fill="#fd456f"/>
    <text x="226.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">DD</text>
  </g>
  <g>
    <rect x="193.0" y="141.0" width="20" height="20" rx="3" fill="#fd456f"/>
    <text x="203.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">NR</text>
  </g>
  <g>
    <rect x="170.0" y="141.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="180.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">CW</text>
  </g>
  <g>
    <rect x="147.0" y="141.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="157.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">DD</text>
  </g>
  <g>
    <rect x="124.0" y="141.0" width="20" height="20" rx="3" fill="#fd456f"/>
    <text x="134.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">S</text>
  </g>
  <g>
    <rect x="101.0" y="141.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="111.0" y="154.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">NR</text>
  </g>

  <!-- Overflowing: the jobs that don't fit any more -->
  <g transform="rotate(-8 114.0 112.0)">
    <rect x="104.0" y="102.0" width="20" height="20" rx="3" fill="#fd456f"/>
    <text x="114.0" y="115.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">CW</text>
  </g>
  <g transform="rotate(6 138.0 110.0)">
    <rect x="128.0" y="100.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="138.0" y="113.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">DD</text>
  </g>
  <g transform="rotate(-14 125.0 89.0)">
    <rect x="115.0" y="79.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="125.0" y="92.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">NR</text>
  </g>
  <g transform="rotate(12 160.0 113.0)">
    <rect x="150.0" y="103.0" width="20" height="20" rx="3" fill="#fd456f"/>
    <text x="160.0" y="116.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">S</text>
  </g>
  <text x="374" y="179" text-anchor="end" font-size="8" fill="#6c757d">oldest: waiting since 10:02</text>
  <text x="98" y="179" font-size="8" fill="#6c757d">newest: 13:08</text>

  <!-- The worker -->
  <line x1="382" y1="151.0" x2="400" y2="151.0" stroke="#212529" stroke-width="1.3" marker-end="url(#head)"/>
  <rect x="404" y="129.0" width="72" height="44" rx="5" fill="#06bdad"/>
  <text x="440.0" y="148.0" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">worker</text>
  <text x="440.0" y="161.0" text-anchor="middle" font-size="7.5" fill="#fff">how old is it?</text>

  <!-- Fresh: call the API -->
  <line x1="478" y1="151.0" x2="546" y2="151.0" stroke="#28a745" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="512.0" y="134.0" text-anchor="middle" font-size="8.5" fill="#28a745" font-weight="bold">fresh:</text>
  <text x="512.0" y="145.0" text-anchor="middle" font-size="8" fill="#28a745">call the API</text>

  <!-- Failed: back to the end of the line -->
  <path d="M440,127.0 C440,62 394,62 250.0,62 S136,62 136,80" fill="none" stroke="#fd456f" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#head-red)"/>
  <text x="250.0" y="56" text-anchor="middle" font-size="9" fill="#fd456f" font-weight="bold">failed? retry: back to the end of the line</text>

  <!-- Too old: load shedding -->
  <line x1="440.0" y1="175.0" x2="440.0" y2="228" stroke="#212529" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="434.0" y="208.5" text-anchor="end" font-size="8.5" fill="#212529" font-weight="bold">too old: drop it</text>
  <g transform="rotate(18 454.0 224.0)">
    <rect x="444.0" y="214.0" width="20" height="20" rx="3" fill="#35b0e8"/>
    <text x="454.0" y="227.0" text-anchor="middle" font-size="7.5" fill="#fff" font-weight="bold">DD</text>
  </g>
  <path d="M408,236 L472,236 L467,270 L413,270 Z" fill="#fff" stroke="#212529" stroke-width="1.3" stroke-linejoin="round"/>
  <line x1="404" y1="236" x2="476" y2="236" stroke="#212529" stroke-width="2" stroke-linecap="round"/>
  <text x="394" y="248" text-anchor="end" font-size="10" fill="#212529" font-weight="bold">load shedding</text>
  <text x="394" y="261" text-anchor="end" font-size="8" fill="#6c757d">a CPU value from 3 hours ago</text>
  <text x="394" y="271" text-anchor="end" font-size="8" fill="#6c757d">tells you nothing about now</text>

  <!-- Legend -->
  <rect x="14" y="270" width="10" height="10" rx="2" fill="#35b0e8"/>
  <text x="28" y="278.5" font-size="8" fill="#212529">new job</text>
  <rect x="76" y="270" width="10" height="10" rx="2" fill="#fd456f"/>
  <text x="90" y="278.5" font-size="8" fill="#212529">retry</text>
  <text x="14" y="292" font-size="8" fill="#6c757d">DD Datadog · S Sentry · NR New Relic · CW CloudWatch</text>
</svg>
