<svg viewBox="0 0 520 242" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="242" fill="#fff"/>

  <!-- Title -->
  <text x="15" y="24" font-size="12" font-weight="bold" fill="#28a745">One metric in Redis</text>
  <text x="15" y="38" font-size="9" fill="#6c757d">read and written together in 1 pipeline, every key has TTL 14 days</text>

  <!-- measurements: fixed length, newest at the end, empty string where we got no value -->
  <text x="15" y="69" font-size="8" fill="#6c757d">mmt:7:42:<tspan fill="#212529" font-weight="bold" font-size="9">measurements</tspan></text>
  <rect x="150" y="60" width="30" height="12" rx="3" fill="#f0f0f0" stroke="#dadada" stroke-width="1"/>
  <text x="165" y="68.5" font-size="7" fill="#6c757d" text-anchor="middle">LIST</text>
  <rect x="190" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="201" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="212" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="223" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="234" y="58" width="11" height="16" fill="#ffed50" stroke="#e6a000" stroke-width="1.8"/>
  <rect x="245" y="58" width="11" height="16" fill="#ffed50" stroke="#e6a000" stroke-width="1.8"/>
  <rect x="256" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="267" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="278" y="58" width="11" height="16" fill="#fff" stroke="#e7d749" stroke-width="1"/>
  <rect x="289" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="300" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="311" y="58" width="11" height="16" fill="#ffed50" stroke="#e6a000" stroke-width="1.8"/>
  <rect x="322" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="333" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="344" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="355" y="58" width="11" height="16" fill="#ffed50" stroke="#fd456f" stroke-width="1.8"/>
  <rect x="366" y="58" width="11" height="16" fill="#ffed50" stroke="#fd456f" stroke-width="1.8"/>
  <rect x="377" y="58" width="11" height="16" fill="#ffed50" stroke="#fd456f" stroke-width="1.8"/>
  <rect x="388" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="399" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="410" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="421" y="58" width="11" height="16" fill="#fff" stroke="#e7d749" stroke-width="1"/>
  <rect x="432" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="443" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="454" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <rect x="465" y="58" width="11" height="16" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="283.5" y="69" font-size="7" fill="#6c757d" text-anchor="middle">""</text>
  <text x="426.5" y="69" font-size="7" fill="#6c757d" text-anchor="middle">""</text>
  <text x="190" y="85" font-size="7.5" fill="#6c757d">0 · oldest</text>
  <text x="476" y="85" font-size="7.5" fill="#6c757d" text-anchor="end">newest · 20,159</text>
  <text x="333.0" y="85" font-size="7.5" fill="#212529" text-anchor="middle">20,160 slots × 2 min = 28 days</text>

  <!-- ailing_idx: positions in measurements, only the not-healthy ones -->
  <text x="15" y="115" font-size="8" fill="#6c757d">mmt:7:42:<tspan fill="#212529" font-weight="bold" font-size="9">ailing_idx</tspan></text>
  <rect x="150" y="106" width="30" height="12" rx="3" fill="#f0f0f0" stroke="#dadada" stroke-width="1"/>
  <text x="165" y="114.5" font-size="7" fill="#6c757d" text-anchor="middle">LIST</text>
  <rect x="190" y="104" width="18" height="15" fill="#fff283" stroke="#e6a000" stroke-width="1"/>
  <text x="199" y="114.5" font-size="8" fill="#212529" text-anchor="middle">4</text>
  <rect x="208" y="104" width="18" height="15" fill="#fff283" stroke="#e6a000" stroke-width="1"/>
  <text x="217" y="114.5" font-size="8" fill="#212529" text-anchor="middle">5</text>
  <rect x="226" y="104" width="18" height="15" fill="#fff283" stroke="#e6a000" stroke-width="1"/>
  <text x="235" y="114.5" font-size="8" fill="#212529" text-anchor="middle">11</text>
  <text x="252" y="115" font-size="8" fill="#6c757d">→ slots 4, 5, 11 were AILING</text>

  <!-- unhealthy_idx: positions in measurements, only the not-healthy ones -->
  <text x="15" y="139" font-size="8" fill="#6c757d">mmt:7:42:<tspan fill="#212529" font-weight="bold" font-size="9">unhealthy_idx</tspan></text>
  <rect x="150" y="130" width="30" height="12" rx="3" fill="#f0f0f0" stroke="#dadada" stroke-width="1"/>
  <text x="165" y="138.5" font-size="7" fill="#6c757d" text-anchor="middle">LIST</text>
  <rect x="190" y="128" width="18" height="15" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="199" y="138.5" font-size="8" fill="#212529" text-anchor="middle">15</text>
  <rect x="208" y="128" width="18" height="15" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="217" y="138.5" font-size="8" fill="#212529" text-anchor="middle">16</text>
  <rect x="226" y="128" width="18" height="15" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="235" y="138.5" font-size="8" fill="#212529" text-anchor="middle">17</text>
  <text x="252" y="139" font-size="8" fill="#6c757d">→ everything not listed is HEALTHY</text>

  <!-- _meta: one timestamp, every other slot time is computed from it -->
  <text x="15" y="163" font-size="8" fill="#6c757d">mmt:7:42:<tspan fill="#212529" font-weight="bold" font-size="9">_meta</tspan></text>
  <rect x="150" y="154" width="30" height="12" rx="3" fill="#f0f0f0" stroke="#dadada" stroke-width="1"/>
  <text x="165" y="162.5" font-size="7" fill="#6c757d" text-anchor="middle">HASH</text>
  <text x="190" y="163" font-size="9" fill="#212529">{ last_change: "2021-10-26T10:08" }</text>

  <!-- Formula: the time of every slot is computed, not stored -->
  <line x1="15" y1="182" x2="505" y2="182" stroke="#dadada" stroke-width="0.5"/>
  <text x="15" y="204" font-size="12" fill="#212529">time of slot <tspan font-weight="bold">i</tspan> = <tspan font-weight="bold">last_change</tspan> − (20,159 − <tspan font-weight="bold">i</tspan>) × 2 min</text>
  <text x="15" y="222" font-size="9" fill="#6c757d"><tspan font-weight="bold" fill="#212529">i</tspan> = position in measurements (0 = oldest, 20,159 = newest), so no timestamps are stored</text>
  <text x="15" y="235" font-size="9" fill="#6c757d">e.g. slot 20,157 = 10:08 − 2 × 2 min = 10:04</text>
</svg>
