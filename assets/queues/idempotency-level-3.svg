<svg viewBox="0 0 600 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="250" fill="#fff"/>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#212529"/></marker><marker id="arrowm" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#6c757d"/></marker></defs>

  <!-- FLOW: start -> email sent? -> (no) send email [outside] -> save sent_at -> ack -->

  <!-- OUTSIDE OUR SYSTEM: the email provider, dashed frame around the send step -->
  <rect x="162" y="51" width="104" height="110" rx="10" fill="#fff" stroke="#6c757d" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="214" y="177" font-size="10" fill="#6c757d" font-weight="bold" text-anchor="middle">outside our system</text>
  <circle cx="18.0" cy="92.0" r="6" fill="#212529"/>
  <text x="18" y="140" font-size="10" fill="#6c757d" text-anchor="middle">start</text>
  <line x1="24" y1="92" x2="56.14" y2="92" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="68.75" y="68.75" width="46.5" height="46.5" rx="9" fill="#35b0e8" stroke="#1f8fc4" stroke-width="2.2" transform="rotate(45 92 92)"/>
  <g transform="translate(92 92) scale(1.45) translate(-92 -92)">
  <text x="92" y="97.5" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">?</text>
  </g>
  <text x="92" y="140" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">email</text>
  <text x="92" y="152" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">sent?</text>
  <line x1="124.86" y1="92" x2="180" y2="92" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="153.93" y="86" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">no</text>
  <circle cx="214.0" cy="92.0" r="31" fill="#06bdad" stroke="#04968a" stroke-width="2.2"/>
  <g transform="translate(214 92) scale(1.45) translate(-214 -92)">
  <rect x="205" y="85.5" width="18" height="13" fill="none" rx="2" stroke="#fff" stroke-width="2.2"/>
  <path d="M 205 86 L 214 93 L 223 86" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="214" y="140" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">send</text>
  <text x="214" y="152" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">email</text>
  <line x1="245" y1="92" x2="316" y2="92" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="350.0" cy="92.0" r="31" fill="#06bdad" stroke="#04968a" stroke-width="2.2"/>
  <g transform="translate(350 93) scale(1.45) translate(-350 -93)">
  <path d="M 342 87 V 99 A 8 3 0 0 0 358 99 V 87" fill="#fff"/>
  <ellipse cx="350" cy="87" rx="8" ry="3" fill="#fff" stroke="#06bdad" stroke-width="1"/>
  <path d="M 342 93 A 8 3 0 0 0 358 93" fill="none" stroke="#06bdad" stroke-width="1"/>
  </g>
  <text x="350" y="140" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">save</text>
  <text x="350" y="152" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">sent_at</text>
  <line x1="381" y1="92" x2="443" y2="92" stroke="#212529" stroke-width="1.5"/>
  <circle cx="446.0" cy="92.0" r="2.5" fill="#212529"/>
  <path d="M 92 59.14 C 92 22, 446 22, 446 89" fill="none" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="269.0" y="20" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">yes</text>
  <line x1="448" y1="92" x2="506" y2="92" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="540.0" cy="92.0" r="31" fill="#ff7898" stroke="#e85a80" stroke-width="2.2"/>
  <g transform="translate(540 92) scale(1.45) translate(-540 -92)">
  <path d="M 533 92 L 538 97.5 L 548 86.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="540" y="140" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">ack</text>

  <!-- THE GAP: crash after the send, before the save -->
  <circle cx="286.0" cy="92.0" r="10" fill="#fd456f"/>
  <line x1="282.0" y1="88" x2="290.0" y2="96" stroke="#fff" stroke-width="2"/>
  <line x1="282.0" y1="96" x2="290.0" y2="88" stroke="#fff" stroke-width="2"/>
  <line x1="286.0" y1="103" x2="286.0" y2="206" stroke="#fd456f" stroke-width="1.3"/>
  <text x="286.0" y="222" font-size="10" fill="#fd456f" font-weight="bold" text-anchor="middle">a crash here: the email is out, sent_at is empty,</text>
  <text x="286.0" y="236" font-size="10" fill="#fd456f" font-weight="bold" text-anchor="middle">so the next run sends it again</text>
</svg>
