<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="560" height="300" fill="#fff"/>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#212529"/></marker><marker id="arrowm" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#6c757d"/></marker></defs>

  <!-- TIME AXIS -->
  <line x1="30" y1="210" x2="536" y2="210" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="538" y="214" font-size="9" fill="#6c757d">time</text>
  <line x1="70" y1="205" x2="70" y2="215" stroke="#212529" stroke-width="1.5"/>
  <text x="70" y="228" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">10:00</text>
  <line x1="205" y1="205" x2="205" y2="215" stroke="#212529" stroke-width="1.5"/>
  <text x="205" y="228" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">10:15</text>
  <line x1="265" y1="205" x2="265" y2="215" stroke="#212529" stroke-width="1.5"/>
  <text x="265" y="228" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">10:20</text>
  <line x1="470" y1="205" x2="470" y2="215" stroke="#212529" stroke-width="1.5"/>
  <text x="470" y="228" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">10:40</text>

  <!-- LANE 1: the user clicks (blue) -->
  <circle cx="70.0" cy="64.0" r="20" fill="#35b0e8" stroke="#1f8fc4" stroke-width="2.2"/>
  <g transform="translate(70 64) scale(1.2) translate(-70 -64)">
  <circle cx="67.0" cy="60.0" r="4.2" fill="#fff"/>
  <path d="M 59.5 72 Q 67 61.5 74.5 72 Z" fill="#fff"/>
  <line x1="74.5" y1="61" x2="81" y2="61" stroke="#fff" stroke-width="1.9"/>
  <line x1="77.75" y1="57.7" x2="77.75" y2="64.3" stroke="#fff" stroke-width="1.9"/>
  </g>
  <text x="70" y="34" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">user clicks subscribe</text>
  <circle cx="205.0" cy="64.0" r="20" fill="#35b0e8" stroke="#1f8fc4" stroke-width="2.2"/>
  <g transform="translate(205 64) scale(1.2) translate(-205 -64)">
  <circle cx="202.0" cy="60.0" r="4.2" fill="#fff"/>
  <path d="M 194.5 72 Q 202 61.5 209.5 72 Z" fill="#fff"/>
  <line x1="209.5" y1="61" x2="216" y2="61" stroke="#fff" stroke-width="1.9"/>
  </g>
  <text x="215" y="34" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">user clicks unsubscribe</text>

  <!-- LANE 2: the tasks run (teal) -->
  <circle cx="265.0" cy="150.0" r="20" fill="#06bdad" stroke="#04968a" stroke-width="2.2"/>
  <g transform="translate(265 150) scale(1.2) translate(-265 -150)">
  <circle cx="262.0" cy="146.0" r="4.2" fill="#fff"/>
  <path d="M 254.5 158 Q 262 147.5 269.5 158 Z" fill="#fff"/>
  <line x1="269.5" y1="147" x2="276" y2="147" stroke="#fff" stroke-width="1.9"/>
  </g>
  <text x="265" y="186" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">unsubscribe task runs</text>
  <circle cx="470.0" cy="150.0" r="20" fill="#06bdad" stroke="#04968a" stroke-width="2.2"/>
  <g transform="translate(470 150) scale(1.2) translate(-470 -150)">
  <circle cx="467.0" cy="146.0" r="4.2" fill="#fff"/>
  <path d="M 459.5 158 Q 467 147.5 474.5 158 Z" fill="#fff"/>
  <line x1="474.5" y1="147" x2="481" y2="147" stroke="#fff" stroke-width="1.9"/>
  <line x1="477.75" y1="143.7" x2="477.75" y2="150.3" stroke="#fff" stroke-width="1.9"/>
  </g>
  <text x="470" y="186" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">subscribe task finally runs</text>
  <line x1="70" y1="84" x2="70" y2="204" stroke="#6c757d" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="205" y1="84" x2="205" y2="204" stroke="#6c757d" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="265" y1="194" x2="265" y2="204" stroke="#6c757d" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="470" y1="194" x2="470" y2="204" stroke="#6c757d" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- each click becomes a task: the unsubscribe runs quickly, the subscribe gets stuck -->
  <path d="M 217 81 L 255 132" fill="none" stroke="#6c757d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
  <path d="M 85 78 C 180 126, 350 104, 460 131" fill="none" stroke="#6c757d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowm)"/>
  <text x="395" y="90" font-size="9" fill="#6c757d" text-anchor="middle">the subscribe task waits somewhere...</text>

  <!-- THE USER'S STATE below the axis -->
  <text x="30" y="244" font-size="9" fill="#6c757d" font-weight="bold">the user is</text>
  <rect x="30" y="250" width="440" height="22" fill="#adb5bd" rx="4"/>
  <text x="250.0" y="265" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">not subscribed</text>
  <rect x="472" y="250" width="64" height="22" fill="#fd456f" rx="4"/>
  <text x="504.0" y="265" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">subscribed!</text>
  <text x="536" y="290" font-size="9" fill="#fd456f" font-weight="bold" text-anchor="end">but they unsubscribed 25 minutes ago</text>
</svg>
