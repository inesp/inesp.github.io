  <text x="340.0" y="96" font-size="9" fill="#6c757d" text-anchor="middle">the broker has already forgotten it while it runs</text>

  <!-- ROW: acked late -->
  <text x="30" y="128" font-size="12" fill="#212529" font-weight="bold">acked late</text>
  <path d="M 30 163 L 112 163 A 9 15 0 0 1 112 193 L 30 193 A 9 15 0 0 1 30 163 Z" fill="#fff" stroke="#212529" stroke-width="1.5"/>
  <ellipse cx="112" cy="178" rx="9" ry="15" fill="none" stroke="#212529" stroke-width="1.5"/>
