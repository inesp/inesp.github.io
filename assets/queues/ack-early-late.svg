  <!-- the task running, left to right in time -->
  <rect x="200" y="169" width="280" height="18" fill="#06bdad" rx="4"/>
  <text x="340.0" y="182" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">send_invoice runs</text>

  <!-- the ack: from that moment back to the broker's copy -->
  <circle cx="476.0" cy="163.0" r="3" fill="#ff7898"/>
  <path d="M 476 163 Q 284.0 118 94 160" fill="none" stroke="#ff7898" stroke-width="2" marker-end="url(#ack)"/>
  <text x="284.0" y="132" font-size="10" fill="#ff7898" font-weight="bold" text-anchor="middle">ack</text>
  <text x="340.0" y="204" font-size="9" fill="#6c757d" text-anchor="middle">the broker keeps its copy until it’s done</text>

  <!-- time axis -->
  <line x1="200" y1="226" x2="480" y2="226" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="486" y="229" font-size="8" fill="#6c757d">time</text>
