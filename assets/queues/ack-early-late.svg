  <line x1="122" y1="178" x2="150" y2="178" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="183.3,174.1 187.7,174.8 187.7,181.2 183.3,181.9 183.2,182.3 186.1,185.6 182.0,190.5 178.1,188.3 177.9,188.5 177.9,192.9 171.6,194.0 170.1,189.8 169.8,189.8 166.9,193.2 161.4,190.0 162.9,185.8 162.7,185.6 158.4,186.4 156.2,180.4 160.0,178.2 160.0,177.8 156.2,175.6 158.4,169.6 162.7,170.4 162.9,170.2 161.4,166.0 166.9,162.8 169.8,166.2 170.1,166.2 171.6,162.0 177.9,163.1 177.9,167.5 178.1,167.7 182.0,165.5 186.1,170.4 183.2,173.7" fill="#06bdad"/>
