<svg viewBox="0 0 520 222" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="222" fill="#fff"/>

  <!-- THE ACK: after the email, in both runs -->
  <line x1="335.0" y1="30" x2="335.0" y2="196" stroke="#ff7898" stroke-width="2.5"/>
  <rect x="315.0" y="14" width="40" height="17" fill="#ff7898" rx="8.5"/>
  <text x="335.0" y="26" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">ack</text>

  <!-- RUN 1: the user is subscribed, then the worker crashes -->
  <text x="30" y="50" font-size="10" fill="#6c757d" font-weight="bold">1st run</text>
  <rect x="30" y="58" width="148" height="40" fill="#06bdad" rx="4"/>
  <circle cx="50.0" cy="74.0" r="4" fill="#fff"/>
  <path d="M 43 86.0 Q 50 76.0 57 86.0 Z" fill="#fff"/>
  <line x1="60" y1="73.0" x2="60" y2="79.0" stroke="#fff" stroke-width="1.6"/>
  <line x1="57" y1="76.0" x2="63" y2="76.0" stroke="#fff" stroke-width="1.6"/>
  <text x="70" y="82.0" font-size="11" fill="#fff" font-weight="bold">subscribe user</text>
  <rect x="184" y="58" width="148" height="40" rx="4" fill="#fff" stroke="#6c757d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="197" y="72.0" width="18" height="13" fill="none" rx="1.5" stroke="#6c757d" stroke-width="1.6"/>
  <path d="M 197 72.0 L 206 79.0 L 215 72.0" fill="none" stroke="#6c757d" stroke-width="1.6"/>
  <text x="224" y="82.0" font-size="11" fill="#6c757d" font-weight="bold">send email</text>
  <rect x="338" y="58" width="148" height="40" rx="4" fill="#fff" stroke="#6c757d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="352" y="79.0" width="4" height="6" fill="#6c757d" rx="0.5"/>
  <rect x="358" y="74.0" width="4" height="11" fill="#6c757d" rx="0.5"/>
  <rect x="364" y="70.0" width="4" height="15" fill="#6c757d" rx="0.5"/>
  <text x="378" y="82.0" font-size="11" fill="#6c757d" font-weight="bold">report metrics</text>
  <circle cx="181.0" cy="78.0" r="10" fill="#fd456f"/>
  <line x1="177.0" y1="74.0" x2="185.0" y2="82.0" stroke="#fff" stroke-width="2"/>
  <line x1="177.0" y1="82.0" x2="185.0" y2="74.0" stroke="#fff" stroke-width="2"/>
  <text x="181.0" y="114" font-size="9" fill="#fd456f" font-weight="bold" text-anchor="middle">the worker crashes, no ack yet</text>

  <!-- RUN 2: another worker gets the task and starts from the top -->
  <text x="30" y="142" font-size="10" fill="#6c757d" font-weight="bold">2nd run, on another worker</text>
  <rect x="30" y="150" width="148" height="40" fill="#e6a000" rx="4"/>
  <circle cx="50.0" cy="166.0" r="4" fill="#fff"/>
  <path d="M 43 178.0 Q 50 168.0 57 178.0 Z" fill="#fff"/>
  <line x1="60" y1="165.0" x2="60" y2="171.0" stroke="#fff" stroke-width="1.6"/>
  <line x1="57" y1="168.0" x2="63" y2="168.0" stroke="#fff" stroke-width="1.6"/>
  <text x="70" y="174.0" font-size="11" fill="#fff" font-weight="bold">subscribe user</text>
  <rect x="184" y="150" width="148" height="40" fill="#06bdad" rx="4"/>
  <rect x="197" y="164.0" width="18" height="13" fill="none" rx="1.5" stroke="#fff" stroke-width="1.6"/>
  <path d="M 197 164.0 L 206 171.0 L 215 164.0" fill="none" stroke="#fff" stroke-width="1.6"/>
  <text x="224" y="174.0" font-size="11" fill="#fff" font-weight="bold">send email</text>
  <rect x="338" y="150" width="148" height="40" fill="#06bdad" rx="4"/>
  <rect x="352" y="171.0" width="4" height="6" fill="#fff" rx="0.5"/>
  <rect x="358" y="166.0" width="4" height="11" fill="#fff" rx="0.5"/>
  <rect x="364" y="162.0" width="4" height="15" fill="#fff" rx="0.5"/>
  <text x="378" y="174.0" font-size="11" fill="#fff" font-weight="bold">report metrics</text>
  <text x="104.0" y="206" font-size="9" fill="#e6a000" font-weight="bold" text-anchor="middle">subscribed a 2nd time</text>
</svg>
