<svg viewBox="0 0 520 170" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="170" fill="#fff"/>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#212529"/></marker></defs>

  <!-- THE TASK subscribe_user, step by step, left to right -->
  <text x="16" y="22" font-size="11" fill="#212529" font-weight="bold">subscribe_user</text>
  <rect x="16" y="36" width="90" height="40" fill="#fff" rx="4" stroke="#212529" stroke-width="1.5"/>
  <text x="61.0" y="60" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">start</text>
  <line x1="106" y1="56.0" x2="115" y2="56.0" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="119" y="36" width="90" height="40" fill="#fff" rx="4" stroke="#212529" stroke-width="1.5"/>
  <text x="164.0" y="54" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">load</text>
  <text x="164.0" y="67" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">user</text>
  <line x1="209" y1="56.0" x2="218" y2="56.0" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="222" y="36" width="90" height="40" fill="#fff" rx="4" stroke="#212529" stroke-width="1.5"/>
  <text x="267.0" y="54" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">save</text>
  <text x="267.0" y="67" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">subscription</text>
  <line x1="312" y1="56.0" x2="321" y2="56.0" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="325" y="36" width="90" height="40" fill="#fff" rx="4" stroke="#212529" stroke-width="1.5"/>
  <text x="370.0" y="54" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">call</text>
  <text x="370.0" y="67" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">newsletter API</text>
  <line x1="415" y1="56.0" x2="424" y2="56.0" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="428" y="36" width="90" height="40" fill="#4a9c6d" rx="4"/>
  <text x="473.0" y="60" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">done</text>

  <!-- SIDE EFFECTS below: what the task leaves behind -->

  <!-- log line, written at the start -->
  <rect x="31.0" y="112" width="60" height="32" fill="#ffed50" rx="3" stroke="#e7d749" stroke-width="1"/>
  <text x="61.0" y="132" font-size="9" fill="#212529" font-weight="bold" text-anchor="middle">log line</text>
  <line x1="61.0" y1="76" x2="61.0" y2="108" stroke="#212529" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- database row, written by 'save subscription' -->
  <path d="M 237.0 116 L 237.0 146 A 30.0 6 0 0 0 297.0 146 L 297.0 116" fill="#35b0e8"/>
  <ellipse cx="267.0" cy="116" rx="30.0" ry="6" fill="#7cc8ee"/>
  <text x="267.0" y="140" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">DB row</text>
  <line x1="267.0" y1="76" x2="267.0" y2="106" stroke="#212529" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- an email, sent through the newsletter API -->
  <rect x="344.0" y="112" width="52" height="34" fill="#ff7898" rx="3"/>
  <path d="M 344.0 112 L 370.0 131 L 396.0 112" fill="none" stroke="#fff" stroke-width="1.5"/>
  <line x1="370.0" y1="76" x2="370.0" y2="108" stroke="#212529" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
</svg>
