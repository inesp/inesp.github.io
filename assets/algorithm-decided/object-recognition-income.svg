<svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="480" height="270" fill="#fff"/>
  <text x="240" y="26" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">Is this soap? Depends how rich you are</text>
  <text x="240" y="42" font-size="9" fill="#6c757d" text-anchor="middle">average accuracy of 6 object recognition systems on household photos (DeVries et al., 2019)</text>

  <!-- Grid lines (subtle) -->
  <line x1="70" y1="177.0" x2="440" y2="177.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="180.0" font-size="9" fill="#6c757d" text-anchor="end">70%</text>
  <line x1="70" y1="121.0" x2="440" y2="121.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="124.0" font-size="9" fill="#6c757d" text-anchor="end">80%</text>
  <line x1="70" y1="65.0" x2="440" y2="65.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="68.0" font-size="9" fill="#6c757d" text-anchor="end">90%</text>

  <!-- Axes -->
  <line x1="70" y1="205" x2="440" y2="205" stroke="#212529" stroke-width="1.5"/>
  <polygon points="448,205 438,201 438,209" fill="#212529"/>
  <line x1="70" y1="205" x2="70" y2="57" stroke="#212529" stroke-width="1.5"/>
  <polygon points="70,49 66,59 74,59" fill="#212529"/>
  <text x="84.1" y="219" font-size="9" fill="#6c757d" text-anchor="middle">$50</text>
  <text x="171.7" y="219" font-size="9" fill="#6c757d" text-anchor="middle">$200</text>
  <text x="273.3" y="219" font-size="9" fill="#6c757d" text-anchor="middle">$1,000</text>
  <text x="375.0" y="219" font-size="9" fill="#6c757d" text-anchor="middle">$5,000</text>
  <text x="255.0" y="235" font-size="11" fill="#212529" text-anchor="middle">household income per month</text>

  <!-- Accuracy by income bracket -->
  <polyline points="90.1,168.6 126.0,163.6 163.6,146.2 193.8,131.6 224.7,121.6 255.4,103.1 276.4,96.9 308.5,91.3 351.5,84.6 419.4,90.2" fill="none" stroke="#06bdad" stroke-width="2"/>
  <circle cx="90.1" cy="168.6" r="3.5" fill="#06bdad"/>
  <circle cx="126.0" cy="163.6" r="3.5" fill="#06bdad"/>
  <circle cx="163.6" cy="146.2" r="3.5" fill="#06bdad"/>
  <circle cx="193.8" cy="131.6" r="3.5" fill="#06bdad"/>
  <circle cx="224.7" cy="121.6" r="3.5" fill="#06bdad"/>
  <circle cx="255.4" cy="103.1" r="3.5" fill="#06bdad"/>
  <circle cx="276.4" cy="96.9" r="3.5" fill="#06bdad"/>
  <circle cx="308.5" cy="91.3" r="3.5" fill="#06bdad"/>
  <circle cx="351.5" cy="84.6" r="3.5" fill="#06bdad"/>
  <circle cx="419.4" cy="90.2" r="3.5" fill="#06bdad"/>
  <text x="98.1" y="182.6" font-size="10" fill="#fd456f" font-weight="bold">71.5%</text>
  <text x="351.5" y="74.6" font-size="10" fill="#00a89a" font-weight="bold" text-anchor="middle">86.5%</text>
  <text x="440" y="262" font-size="8" fill="#6c757d" text-anchor="end">top-5 accuracy, Dollar Street photos from 54 countries</text>
</svg>
