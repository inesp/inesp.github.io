  <circle cx="472" cy="162" r="8" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="2,1.5"/>
  <text x="472" y="165.5" font-size="9" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="318" cy="184" r="8" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="2,1.5"/>
