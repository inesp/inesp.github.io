  <text x="210" y="115" font-size="7.5" fill="#fff" text-anchor="middle">(approved, released)</text>
  <line x1="245" y1="88" x2="300" y2="66" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="245" y1="122" x2="300" y2="150" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- YES: outcome known -->
  <text x="310" y="50" font-size="10" fill="#28a745" font-weight="bold">Yes → we see how it went</text>
