  <rect x="250" y="242" width="10" height="10" fill="#ff7898" rx="2"/>
  <text x="264.0" y="250.5" font-size="9" fill="#212529" text-anchor="start">estimation error</text>
  <text x="260.0" y="276.0" font-size="10" fill="#212529" text-anchor="middle" font-weight="bold">The more projects you compare, the more overestimated your winner is.</text>
