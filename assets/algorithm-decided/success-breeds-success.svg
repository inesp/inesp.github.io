<svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="480" height="270" fill="#fff"/>
  <text x="240" y="26" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">A random first push, and strangers pile on</text>
  <text x="240" y="42" font-size="9" fill="#6c757d" text-anchor="middle">share that later got support from other people (van de Rijt et al., 2014)</text>

  <!-- Legend -->
  <rect x="150" y="51" width="10" height="10" rx="2" fill="#dadada"/><text x="165" y="60" font-size="9" fill="#212529">no push</text>
  <rect x="225" y="51" width="10" height="10" rx="2" fill="#06bdad"/><text x="240" y="60" font-size="9" fill="#212529">random early push</text>

  <!-- Baseline -->
  <line x1="30" y1="200" x2="450" y2="200" stroke="#212529" stroke-width="1.5"/>
  <!-- Kickstarter: 39% → 70% -->
  <rect x="61" y="149.3" width="22" height="50.7" rx="2" fill="#dadada"/>
  <text x="72" y="145.3" font-size="10" fill="#6c757d" font-weight="bold" text-anchor="middle">39%</text>
  <rect x="87" y="109.0" width="22" height="91.0" rx="2" fill="#06bdad"/>
  <text x="98" y="105.0" font-size="10" fill="#00a89a" font-weight="bold" text-anchor="middle">70%</text>
  <text x="85" y="215" font-size="11" fill="#212529" font-weight="bold" text-anchor="middle">Kickstarter</text>
  <text x="85" y="228" font-size="8.5" fill="#6c757d" text-anchor="middle">a small donation</text>
  <!-- Epinions: 77% → 90% -->
  <rect x="166" y="99.9" width="22" height="100.1" rx="2" fill="#dadada"/>
  <text x="177" y="95.9" font-size="10" fill="#6c757d" font-weight="bold" text-anchor="middle">77%</text>
  <rect x="192" y="83.0" width="22" height="117.0" rx="2" fill="#06bdad"/>
  <text x="203" y="79.0" font-size="10" fill="#00a89a" font-weight="bold" text-anchor="middle">90%</text>
  <text x="190" y="215" font-size="11" fill="#212529" font-weight="bold" text-anchor="middle">Epinions</text>
  <text x="190" y="228" font-size="8.5" fill="#6c757d" text-anchor="middle">one "very helpful" rating</text>
  <!-- Wikipedia: 31% → 40% -->
  <rect x="271" y="159.7" width="22" height="40.3" rx="2" fill="#dadada"/>
  <text x="282" y="155.7" font-size="10" fill="#6c757d" font-weight="bold" text-anchor="middle">31%</text>
  <rect x="297" y="148.0" width="22" height="52.0" rx="2" fill="#06bdad"/>
  <text x="308" y="144.0" font-size="10" fill="#00a89a" font-weight="bold" text-anchor="middle">40%</text>
  <text x="295" y="215" font-size="11" fill="#212529" font-weight="bold" text-anchor="middle">Wikipedia</text>
  <text x="295" y="228" font-size="8.5" fill="#6c757d" text-anchor="middle">an award</text>
  <!-- Change.org: 52% → 66% -->
  <rect x="376" y="132.4" width="22" height="67.6" rx="2" fill="#dadada"/>
  <text x="387" y="128.4" font-size="10" fill="#6c757d" font-weight="bold" text-anchor="middle">52%</text>
  <rect x="402" y="114.2" width="22" height="85.8" rx="2" fill="#06bdad"/>
  <text x="413" y="110.2" font-size="10" fill="#00a89a" font-weight="bold" text-anchor="middle">66%</text>
  <text x="400" y="215" font-size="11" fill="#212529" font-weight="bold" text-anchor="middle">Change.org</text>
  <text x="400" y="228" font-size="8.5" fill="#6c757d" text-anchor="middle">12 signatures</text>
  <text x="240" y="260" font-size="8" fill="#6c757d" text-anchor="middle">who got the push was picked at random, so nothing else about them was different</text>
</svg>
