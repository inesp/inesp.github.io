<svg viewBox="0 0 520 204" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="204" fill="#fff"/>
  <text x="260.0" y="24" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">Truncation and censoring in charts</text>

  <!-- LEFT: censoring, the row is there but stuck at the limit -->
  <text x="130" y="52" font-size="12" fill="#ff7898" font-weight="bold" text-anchor="middle">Censoring</text>
  <text x="130" y="67" font-size="9" fill="#6c757d" text-anchor="middle">the rows are there, stuck at the limit</text>
  <rect x="24" y="166" width="14" height="24" fill="#06bdad" rx="2"/>
  <rect x="42" y="142" width="14" height="48" fill="#06bdad" rx="2"/>
  <rect x="60" y="124" width="14" height="66" fill="#06bdad" rx="2"/>
  <rect x="78" y="118" width="14" height="72" fill="#06bdad" rx="2"/>
  <rect x="96" y="130" width="14" height="60" fill="#06bdad" rx="2"/>
  <rect x="114" y="142" width="14" height="48" fill="#06bdad" rx="2"/>
  <rect x="132" y="154" width="14" height="36" fill="#06bdad" rx="2"/>
  <rect x="150" y="160" width="14" height="30" fill="#06bdad" rx="2"/>
  <rect x="168" y="166" width="14" height="24" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <rect x="186" y="172" width="14" height="18" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <rect x="204" y="178" width="14" height="12" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <rect x="222" y="178" width="14" height="12" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2" rx="2"/>

  <!-- everything past the limit lands on the last bar -->
  <rect x="150" y="94" width="14" height="66" fill="#ff7898" rx="2"/>
  <text x="146" y="102" font-size="10" fill="#ff7898" font-weight="bold" text-anchor="end">pile</text>
  <line x1="166" y1="72" x2="166" y2="190" stroke="#fd456f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="170" y="80" font-size="9" fill="#fd456f" font-weight="bold">the limit</text>
  <line x1="22" y1="190" x2="238" y2="190" stroke="#212529" stroke-width="1.5"/>

  <!-- RIGHT: truncation, past the limit the rows are gone -->
  <text x="390" y="52" font-size="12" fill="#35b0e8" font-weight="bold" text-anchor="middle">Truncation</text>
  <text x="390" y="67" font-size="9" fill="#6c757d" text-anchor="middle">past the limit, the rows are gone</text>
  <rect x="284" y="178" width="14" height="12" fill="#06bdad" rx="2"/>
  <rect x="302" y="172" width="14" height="18" fill="#06bdad" rx="2"/>
  <rect x="320" y="160" width="14" height="30" fill="#06bdad" rx="2"/>
  <rect x="338" y="148" width="14" height="42" fill="#06bdad" rx="2"/>
  <rect x="356" y="136" width="14" height="54" fill="#06bdad" rx="2"/>
  <rect x="374" y="124" width="14" height="66" fill="#06bdad" rx="2"/>
  <rect x="392" y="112" width="14" height="78" fill="#06bdad" rx="2"/>
  <rect x="410" y="100" width="14" height="90" fill="#06bdad" rx="2"/>
  <rect x="428" y="118" width="14" height="72" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <rect x="446" y="142" width="14" height="48" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <rect x="464" y="160" width="14" height="30" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <rect x="482" y="172" width="14" height="18" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <text x="408" y="94" font-size="10" fill="#35b0e8" font-weight="bold" text-anchor="end">cliff</text>
  <line x1="426" y1="72" x2="426" y2="190" stroke="#fd456f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="430" y="80" font-size="9" fill="#fd456f" font-weight="bold">the limit</text>
  <line x1="282" y1="190" x2="498" y2="190" stroke="#212529" stroke-width="1.5"/>
</svg>
