  <!-- Title block -->
  <text x="260.0" y="28.0" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">They were kept out of the training. Their earnings recovered anyway.</text>
  <text x="260.0" y="44.0" font-size="9" fill="#6c757d" text-anchor="middle">Men who applied to a US job-training program, but were randomly kept out of it</text>

  <!-- Grid lines -->
  <line x1="75" y1="240.0" x2="470" y2="240.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="69.0" y="243.0" font-size="8" fill="#6c757d" text-anchor="end">$200</text>
  <line x1="75" y1="183.3" x2="470" y2="183.3" stroke="#dadada" stroke-width="0.5"/>
  <text x="69.0" y="186.3" font-size="8" fill="#6c757d" text-anchor="end">$400</text>
  <line x1="75" y1="126.7" x2="470" y2="126.7" stroke="#dadada" stroke-width="0.5"/>
  <text x="69.0" y="129.7" font-size="8" fill="#6c757d" text-anchor="end">$600</text>
  <line x1="75" y1="70.0" x2="470" y2="70.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="69.0" y="73.0" font-size="8" fill="#6c757d" text-anchor="end">$800</text>

  <!-- Job loss: spread over the months before applying, not one moment -->
  <rect x="184.7" y="64" width="87.8" height="176" fill="#ffe6e6" opacity="0.6"/>
  <text x="228.6" y="78.0" font-size="8" fill="#fd456f" font-weight="bold" text-anchor="middle">many lost their job</text>
  <text x="228.6" y="88.0" font-size="8" fill="#fd456f" font-weight="bold" text-anchor="middle">in these months</text>

