  <line x1="272.5" y1="64" x2="272.5" y2="240" stroke="#212529" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="272.5" y="60.0" font-size="9" fill="#212529" font-weight="bold" text-anchor="middle">applied for training</text>

