<svg viewBox="0 0 520 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="290" fill="#fff"/>

  <!-- Title block -->
  <text x="260" y="28" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">How bad the sprint was = real fragility + luck</text>

  <!-- Axes -->
  <line x1="60" y1="240" x2="480" y2="240" stroke="#212529" stroke-width="1.5"/>
  <polygon points="490,240 480,236 480,244" fill="#212529"/>
  <line x1="60" y1="70" x2="60" y2="240" stroke="#212529" stroke-width="1.5"/>
  <text x="20" y="155" font-size="10" fill="#6c757d" text-anchor="middle" transform="rotate(-90, 20, 155)">Incidents per sprint</text>
  <text x="265" y="262" font-size="10" fill="#6c757d" text-anchor="middle">Sprints</text>

  <!-- The real fragility of the system: the same every sprint -->
  <line x1="60" y1="183.33333333333334" x2="480" y2="183.33333333333334" stroke="#4a9c6d" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="478" y="211.66666666666666" font-size="9" fill="#4a9c6d" font-weight="bold" text-anchor="end">how fragile the system really is</text>
  <line x1="450" y1="202.7" x2="442.7" y2="191.5" stroke="#4a9c6d" stroke-width="1"/>
  <polygon points="440.0,187.3 444.8,190.2 440.6,192.9" fill="#4a9c6d"/>

  <!-- Luck bracket on the worst sprint -->
  <line x1="268.0" y1="87.0" x2="268.0" y2="183.33333333333334" stroke="#fd456f" stroke-width="1"/>
  <line x1="268.0" y1="87.0" x2="272.0" y2="87.0" stroke="#fd456f" stroke-width="1"/>
  <line x1="268.0" y1="183.33333333333334" x2="272.0" y2="183.33333333333334" stroke="#fd456f" stroke-width="1"/>
  <text x="263.0" y="138.16666666666669" font-size="10" fill="#fd456f" font-weight="bold" text-anchor="end">luck</text>

  <!-- One dot per sprint; the worst one is circled -->
  <circle cx="70.0" cy="191.8" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="100.0" cy="174.8" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="130.0" cy="197.5" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="160.0" cy="166.3" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="190.0" cy="186.2" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="220.0" cy="177.7" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="250.0" cy="194.7" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="280.0" cy="87.0" r="5" fill="#fd456f"/>
  <circle cx="280.0" cy="87.0" r="9" fill="none" stroke="#fd456f" stroke-width="1"/>
  <circle cx="310.0" cy="180.5" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="340.0" cy="189.0" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="370.0" cy="172.0" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="400.0" cy="194.7" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="430.0" cy="183.3" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="460.0" cy="174.8" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="294.0" y="90.0" font-size="9" fill="#fd456f" font-weight="bold">the worst sprint: big retro</text>

  <!-- Next sprint: back near the line -->
  <line x1="370.0" y1="140.5" x2="321.9" y2="170.8" stroke="#212529" stroke-width="1"/>
  <polygon points="316.0,174.5 320.1,167.8 323.8,173.7" fill="#212529"/>
  <text x="372.0" y="128.5" font-size="9" fill="#212529">next sprint: the "luck" is gone,</text>
  <text x="372.0" y="139.5" font-size="9" fill="#212529">we revert to the average</text>
</svg>
