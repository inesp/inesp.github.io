<svg viewBox="0 0 520 178" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="178" fill="#fff"/>

  <!-- The ad card -->
  <rect x="40" y="14" width="440" height="134" fill="#fff" stroke="#ffed50" stroke-width="4" rx="8"/>
  <text x="62" y="38" font-size="8" fill="#212529" font-weight="bold" letter-spacing="2">ACME CODING BOOTCAMP</text>

  <!-- Headline -->
  <text x="62" y="64" font-size="18" fill="#212529" font-weight="bold">9 out of 10 graduates</text>
  <text x="62" y="86" font-size="18" fill="#212529" font-weight="bold">find a job within 6 months!</text>

  <!-- Sticker: the earnings claim -->
  <circle cx="420" cy="60" r="28" fill="#fd456f"/>
  <text x="420" y="60" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">+180%</text>
  <text x="420" y="73" font-size="8" fill="#fff" font-weight="bold" text-anchor="middle">earnings*</text>

  <!-- Button -->
  <rect x="62" y="100" width="92" height="22" fill="#212529" rx="11"/>
  <text x="108" y="114.5" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">Enroll today</text>

  <!-- The fine print -->
  <text x="62" y="138" font-size="7" fill="#6c757d">*Measured from the worst month of their lives.</text>

  <!-- Caption -->
  <text x="260" y="168" font-size="9" fill="#6c757d" text-anchor="middle">An ad for the best code bootcamp.</text>
</svg>
