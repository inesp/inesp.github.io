<svg viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="240" fill="#fff"/>

  <!-- Title block -->
  <text x="260.0" y="28" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">What actually decides who died</text>
  <text x="260.0" y="44" font-size="9" fill="#6c757d" text-anchor="middle">the table blames smoking; the real driver is age</text>

  <!-- The confounder on top -->
  <rect x="200" y="70" width="120" height="28" fill="#e0f7f5" rx="4" stroke="#06bdad" stroke-width="1"/>
  <text x="260.0" y="87.5" font-size="10" fill="#008378" font-weight="bold" text-anchor="middle">AGE</text>
  <text x="260" y="112" font-size="8" fill="#6c757d" text-anchor="middle">(the confounder)</text>

  <!-- The two things it feeds -->
  <rect x="100" y="175" width="80" height="28" fill="#fff283" rx="4" stroke="#e7d749" stroke-width="1"/>
  <text x="140.0" y="192.5" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">SMOKING</text>
  <rect x="340" y="175" width="100" height="28" fill="#ffeaff" rx="4" stroke="#da4ada" stroke-width="1"/>
  <text x="390.0" y="192.5" font-size="10" fill="#da4ada" font-weight="bold" text-anchor="middle">DEATH</text>
  <line x1="225" y1="98" x2="157.57990080948014" y2="167.2672251957396" stroke="#212529" stroke-width="1.3"/>
  <polygon points="152.0,173.0 155.1,164.8 160.1,169.7" fill="#212529"/>
  <line x1="295" y1="98" x2="372.0643264987285" y2="167.63643960728479" stroke="#212529" stroke-width="1.3"/>
  <polygon points="378.0,173.0 369.7,170.2 374.4,165.0" fill="#212529"/>
  <text x="175" y="140" font-size="8" fill="#6c757d" text-anchor="end">the young smoked more</text>
  <text x="348" y="140" font-size="8" fill="#6c757d" text-anchor="start">the old died more</text>

  <!-- The link we believe in, dashed red and struck -->
  <line x1="180" y1="189" x2="330.0" y2="189.0" stroke="#6c757d" stroke-width="1.2" stroke-dasharray="4,3"/>
  <polygon points="338.0,189.0 330.0,192.5 330.0,185.5" fill="#6c757d"/>
  <line x1="253" y1="182" x2="265" y2="196" stroke="#6c757d" stroke-width="1.8"/>
  <line x1="253" y1="196" x2="265" y2="182" stroke="#6c757d" stroke-width="1.8"/>
  <text x="259" y="218" font-size="9" fill="#6c757d" text-anchor="middle">we read this as: smoking protects</text>
</svg>
