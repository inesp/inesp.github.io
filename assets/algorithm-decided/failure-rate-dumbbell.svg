  <line x1="186.36363636363637" y1="212" x2="376.3636363636364" y2="212" stroke="#dadada" stroke-width="2"/>
  <circle cx="186.4" cy="212.0" r="4.5" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="376.4" cy="212.0" r="4.5" fill="#fd456f"/>
  <circle cx="207.5" cy="212.0" r="3" fill="#212529"/>
  <text x="24" y="245" font-size="11" fill="#212529">Matej</text>
  <line x1="187.93388429752065" y1="242" x2="284.24242424242425" y2="242" stroke="#dadada" stroke-width="2"/>
  <circle cx="187.9" cy="242.0" r="4.5" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="284.2" cy="242.0" r="4.5" fill="#fd456f"/>
  <circle cx="208.6" cy="242.0" r="3" fill="#212529"/>
  <rect x="16" y="260" width="488" height="24" fill="#d4edda" rx="3" stroke="#4a9c6d" stroke-width="1"/>
  <text x="24" y="275" font-size="11" fill="#28a745" font-weight="bold">Ana</text>
  <line x1="146.06060606060606" y1="272" x2="246.3101604278075" y2="272" stroke="#dadada" stroke-width="2"/>
  <circle cx="146.1" cy="272.0" r="4.5" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="246.3" cy="272.0" r="4.5" fill="#fd456f"/>
  <circle cx="231.3" cy="272.0" r="3" fill="#212529"/>

  <!-- Annotation: the mechanism -->
  <text x="231.27272727272725" y="322" font-size="9" fill="#6c757d" text-anchor="middle">85 of Ana's 100 deploys are high-risk,</text>
  <text x="231.27272727272725" y="334" font-size="9" fill="#6c757d" text-anchor="middle">so her overall dot lives at the red end</text>
</svg>
