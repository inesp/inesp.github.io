  <circle cx="170.9" cy="92.0" r="4.5" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="445.5" cy="92.0" r="4.5" fill="#fd456f"/>
  <circle cx="177.7" cy="92.0" r="3" fill="#212529"/>
  <text x="24" y="125" font-size="11" fill="#212529">Tomasz</text>
  <line x1="177.72727272727272" y1="122" x2="307.27272727272725" y2="122" stroke="#dadada" stroke-width="2"/>
