  <line x1="182.90909090909088" y1="182" x2="307.27272727272725" y2="182" stroke="#dadada" stroke-width="2"/>
  <circle cx="182.9" cy="182.0" r="4.5" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <circle cx="307.3" cy="182.0" r="4.5" fill="#fd456f"/>
  <circle cx="203.6" cy="182.0" r="3" fill="#212529"/>
