<svg viewBox="0 0 520 355" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="355" fill="#fff"/>

  <!-- Title block -->
  <text x="260" y="28" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">Where each engineer's overall rate really sits</text>
  <text x="260" y="44" font-size="9" fill="#6c757d" text-anchor="middle">line spans low-risk to high-risk failure rate; the black dot is the overall rate</text>

  <!-- Legend -->
  <circle cx="24.0" cy="62.0" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="32" y="65" font-size="9" fill="#6c757d">low-risk rate</text>
  <circle cx="110.0" cy="62.0" r="4" fill="#fd456f"/>
  <text x="118" y="65" font-size="9" fill="#6c757d">high-risk rate</text>
  <circle cx="200.0" cy="62.0" r="3" fill="#212529"/>
  <text x="208" y="65" font-size="9" fill="#6c757d">overall rate (all deploys together)</text>

  <!-- Vertical gridlines with % ticks -->
  <line x1="169.0909090909091" y1="84" x2="169.0909090909091" y2="292" stroke="#dadada" stroke-width="0.5"/>
  <text x="169.0909090909091" y="306" font-size="8" fill="#6c757d" text-anchor="middle">10%</text>
  <line x1="238.1818181818182" y1="84" x2="238.1818181818182" y2="292" stroke="#dadada" stroke-width="0.5"/>
  <text x="238.1818181818182" y="306" font-size="8" fill="#6c757d" text-anchor="middle">20%</text>
  <line x1="307.27272727272725" y1="84" x2="307.27272727272725" y2="292" stroke="#dadada" stroke-width="0.5"/>
  <text x="307.27272727272725" y="306" font-size="8" fill="#6c757d" text-anchor="middle">30%</text>
  <line x1="376.3636363636364" y1="84" x2="376.3636363636364" y2="292" stroke="#dadada" stroke-width="0.5"/>
  <text x="376.3636363636364" y="306" font-size="8" fill="#6c757d" text-anchor="middle">40%</text>
  <line x1="445.45454545454544" y1="84" x2="445.45454545454544" y2="292" stroke="#dadada" stroke-width="0.5"/>
  <text x="445.45454545454544" y="306" font-size="8" fill="#6c757d" text-anchor="middle">50%</text>

