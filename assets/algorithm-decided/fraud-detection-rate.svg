<svg viewBox="0 0 520 188" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="188" fill="#fff"/>
  <rect x="8" y="8" width="504" height="172" fill="#fff" rx="4" stroke="#dadada" stroke-width="1.2"/>
  <text x="18" y="26" font-size="10" fill="#212529" font-weight="bold">fraud model: detection rate</text>
  <rect x="422" y="15" width="80" height="16" fill="#f4f5f5" rx="3" stroke="#dadada" stroke-width="1"/>
  <text x="462" y="26" font-size="8.5" fill="#6c757d" text-anchor="middle">Past 90 days</text>

  <!-- FRAUD: only flagged transactions get reviewed, so only flagged fraud gets confirmed -->
  <text x="260" y="104" font-size="54" font-weight="bold" fill="#e6a000" text-anchor="middle">98%</text>
  <text x="260" y="126" font-size="11" fill="#212529" text-anchor="middle">of confirmed fraud was flagged by the model</text>
  <rect x="56" y="166" width="10" height="4" fill="#e6a000" rx="1"/>
  <text x="71" y="171" font-size="8.5" fill="#212529">detection rate</text>
  <text x="490" y="171" font-size="8.5" fill="#6c757d" text-anchor="end">412 confirmed fraud cases · 404 flagged by the model first</text>
</svg>
