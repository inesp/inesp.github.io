<svg viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="480" height="260" fill="#fff"/>
  <text x="240" y="26" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">More women on the list, more competent men</text>
  <text x="240" y="42" font-size="9" fill="#6c757d" text-anchor="middle">Swedish Social Democrats after the 1993 quota (Besley et al., 2017)</text>

  <!-- Grid lines (subtle) -->
  <line x1="70" y1="153.3" x2="440" y2="153.3" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="156.3" font-size="9" fill="#6c757d" text-anchor="end">50%</text>
  <line x1="70" y1="106.7" x2="440" y2="106.7" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="109.7" font-size="9" fill="#6c757d" text-anchor="end">60%</text>
  <line x1="70" y1="60.0" x2="440" y2="60.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="63.0" font-size="9" fill="#6c757d" text-anchor="end">70%</text>

  <!-- Axes -->
  <line x1="70" y1="200" x2="440" y2="200" stroke="#212529" stroke-width="1.5"/>
  <polygon points="448,200 438,196 438,204" fill="#212529"/>
  <line x1="70" y1="200" x2="70" y2="52" stroke="#212529" stroke-width="1.5"/>
  <polygon points="70,44 66,54 74,54" fill="#212529"/>
  <text x="70.0" y="214" font-size="9" fill="#6c757d" text-anchor="middle">+0</text>
  <text x="193.3" y="214" font-size="9" fill="#6c757d" text-anchor="middle">+10</text>
  <text x="316.7" y="214" font-size="9" fill="#6c757d" text-anchor="middle">+20</text>
  <text x="440.0" y="214" font-size="9" fill="#6c757d" text-anchor="middle">+30</text>
  <text x="255.0" y="230" font-size="11" fill="#212529" text-anchor="middle">how much the quota raised the share of women (percentage points)</text>
  <text x="16" y="130.0" font-size="11" fill="#212529" text-anchor="middle" transform="rotate(-90, 16, 130.0)">competent politicians</text>

  <!-- MEN: +4.4 pp competent per +10 pp women -->
  <line x1="70.0" y1="153.3" x2="440.0" y2="91.7" stroke="#35b0e8" stroke-width="3" stroke-linecap="round"/>
  <text x="436.0" y="83.7" font-size="11" fill="#35b0e8" font-weight="bold" text-anchor="end">men</text>
  <circle cx="193.3" cy="132.8" r="4" fill="#35b0e8"/>
  <text x="189.3" y="123.8" font-size="9" fill="#212529" text-anchor="middle">+10 → +4.4 pp</text>

  <!-- WOMEN: no significant change -->
  <line x1="70.0" y1="153.3" x2="440.0" y2="153.3" stroke="#ff7898" stroke-width="3" stroke-linecap="round"/>
  <text x="436.0" y="167.3" font-size="11" fill="#ff7898" font-weight="bold" text-anchor="end">women: no change</text>
</svg>
