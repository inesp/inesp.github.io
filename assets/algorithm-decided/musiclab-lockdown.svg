<svg viewBox="0 0 480 230" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="480" height="230" fill="#fff"/>
  <text x="240" y="26" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">Same song, same 48 songs, different world</text>
  <text x="240" y="42" font-size="9" fill="#6c757d" text-anchor="middle">"Lockdown" by 52metro in the MusicLab experiment (Salganik, Dodds &amp; Watts)</text>

  <!-- Rank axis: 1 (hit) to 48 (flop) -->
  <line x1="60" y1="120" x2="420" y2="120" stroke="#212529" stroke-width="1.5"/>
  <line x1="60.0" y1="117" x2="60.0" y2="123" stroke="#212529" stroke-width="1"/>
  <text x="60.0" y="136" font-size="9" fill="#6c757d" text-anchor="middle">#1</text>
  <line x1="128.9" y1="117" x2="128.9" y2="123" stroke="#212529" stroke-width="1"/>
  <text x="128.9" y="136" font-size="9" fill="#6c757d" text-anchor="middle">#10</text>
  <line x1="205.5" y1="117" x2="205.5" y2="123" stroke="#212529" stroke-width="1"/>
  <text x="205.5" y="136" font-size="9" fill="#6c757d" text-anchor="middle">#20</text>
  <line x1="282.1" y1="117" x2="282.1" y2="123" stroke="#212529" stroke-width="1"/>
  <text x="282.1" y="136" font-size="9" fill="#6c757d" text-anchor="middle">#30</text>
  <line x1="358.7" y1="117" x2="358.7" y2="123" stroke="#212529" stroke-width="1"/>
  <text x="358.7" y="136" font-size="9" fill="#6c757d" text-anchor="middle">#40</text>
  <line x1="420.0" y1="117" x2="420.0" y2="123" stroke="#212529" stroke-width="1"/>
  <text x="420.0" y="136" font-size="9" fill="#6c757d" text-anchor="middle">#48</text>
  <text x="60" y="150" font-size="9" fill="#28a745" font-weight="bold" text-anchor="middle">hit</text>
  <text x="420" y="150" font-size="9" fill="#fd456f" font-weight="bold" text-anchor="middle">flop</text>
  <!-- The three ranks of the same song -->
  <line x1="60.0" y1="120" x2="60.0" y2="94" stroke="#06bdad" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="60.0" cy="120" r="7" fill="#06bdad"/>
  <text x="60.0" y="86" font-size="11" fill="#06bdad" font-weight="bold" text-anchor="middle">#1 in one world</text>
  <line x1="251.5" y1="120" x2="251.5" y2="160" stroke="#e6a000" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="251.5" cy="120" r="7" fill="#e6a000"/>
  <text x="251.5" y="172" font-size="11" fill="#e6a000" font-weight="bold" text-anchor="middle">#26 by quality</text>
  <line x1="358.7" y1="120" x2="358.7" y2="94" stroke="#ff7898" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="358.7" cy="120" r="7" fill="#ff7898"/>
  <text x="358.7" y="86" font-size="11" fill="#ff7898" font-weight="bold" text-anchor="middle">#40 in another world</text>
  <text x="240" y="202" font-size="9" fill="#212529" text-anchor="middle">"by quality" = its rank in the world where nobody saw what others downloaded</text>
  <text x="240" y="218" font-size="9" fill="#6c757d" text-anchor="middle">a song in the Top 5 by quality had only a 50% chance of ending up in the Top 5</text>
</svg>
