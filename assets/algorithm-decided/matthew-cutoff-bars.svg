<svg viewBox="0 0 520 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
<rect width="520" height="250" fill="#fff"/>
<text x="260.0" y="24.0" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">Near-identical scores, one side of the cutoff</text>
<rect x="180" y="37" width="10" height="10" rx="2" fill="#ff7898"/>
<text x="193.0" y="46.0" font-size="10" fill="#212529">just missed the grant</text>
<rect x="320" y="37" width="10" height="10" rx="2" fill="#06bdad"/>
<text x="333.0" y="46.0" font-size="10" fill="#212529">just won it</text>
<!-- applied for the next grant -->
<text x="167.0" y="92.0" font-size="10" fill="#212529" text-anchor="end">applied for the next grant</text>
<rect x="180" y="66" width="200.0" height="22" rx="4" fill="#ff7898"/>
<text x="374.0" y="81.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">40%</text>
<rect x="180" y="92" width="295.0" height="22" rx="4" fill="#06bdad"/>
<text x="469.0" y="107.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">59%</text>
<!-- won the next grant -->
<text x="167.0" y="152.0" font-size="10" fill="#212529" text-anchor="end">won the next grant</text>
<rect x="180" y="126" width="50.0" height="22" rx="4" fill="#ff7898"/>
<text x="224.0" y="141.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">10%</text>
<rect x="180" y="152" width="130.0" height="22" rx="4" fill="#06bdad"/>
<text x="304.0" y="167.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">26%</text>
<!-- full professor 10+ years later -->
<text x="167.0" y="212.0" font-size="10" fill="#212529" text-anchor="end">full professor 10+ years later</text>
<rect x="180" y="186" width="95.0" height="22" rx="4" fill="#ff7898"/>
<text x="269.0" y="201.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">19%</text>
<rect x="180" y="212" width="140.0" height="22" rx="4" fill="#06bdad"/>
<text x="314.0" y="227.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">28%</text>
<text x="512.0" y="244.0" font-size="8" fill="#6c757d" text-anchor="end">Data: Bol, de Vaan, van de Rijt (2018)</text>
</svg>
