<svg viewBox="0 0 520 270" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="270" fill="#fff"/>
  <text x="260" y="26" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">Your weekly "productivity score"</text>
  <text x="260" y="42" font-size="9" fill="#6c757d" text-anchor="middle">as the bossware dashboard sees it</text>
  <!-- Grid lines -->
  <line x1="60" y1="195.0" x2="500" y2="195.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="54" y="198.0" font-size="8" fill="#6c757d" text-anchor="end">0</text>
  <line x1="60" y1="132.5" x2="500" y2="132.5" stroke="#dadada" stroke-width="0.5"/>
  <text x="54" y="135.5" font-size="8" fill="#6c757d" text-anchor="end">50</text>
  <line x1="60" y1="70.0" x2="500" y2="70.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="54" y="73.0" font-size="8" fill="#6c757d" text-anchor="end">100</text>
  <!-- Target line -->
  <line x1="60" y1="101.2" x2="500" y2="101.2" stroke="#fd456f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="500" y="97.2" font-size="8" fill="#fd456f" font-weight="bold" text-anchor="end">TARGET 75</text>
  <!-- Bars: teal above target, pink below -->
  <rect x="71.0" y="90.0" width="33.0" height="105.0" fill="#06bdad" rx="4"/>
  <text x="87.5" y="106.0" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">84</text>
  <text x="87.5" y="208" font-size="8" fill="#6c757d" text-anchor="middle">W1</text>
  <rect x="126.0" y="85.0" width="33.0" height="110.0" fill="#06bdad" rx="4"/>
  <text x="142.5" y="101.0" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">88</text>
  <text x="142.5" y="208" font-size="8" fill="#6c757d" text-anchor="middle">W2</text>
  <rect x="181.0" y="117.5" width="33.0" height="77.5" fill="#ff7898" rx="4"/>
  <text x="197.5" y="133.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">62</text>
  <text x="197.5" y="208" font-size="8" fill="#6c757d" text-anchor="middle">W3</text>
  <text x="197.5" y="225" font-size="9" fill="#6c757d" font-style="italic" text-anchor="middle">sick kid</text>
  <rect x="236.0" y="87.5" width="33.0" height="107.5" fill="#06bdad" rx="4"/>
  <text x="252.5" y="103.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">86</text>
  <text x="252.5" y="208" font-size="8" fill="#6c757d" text-anchor="middle">W4</text>
  <rect x="291.0" y="93.8" width="33.0" height="101.2" fill="#06bdad" rx="4"/>
  <text x="307.5" y="109.8" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">81</text>
  <text x="307.5" y="208" font-size="8" fill="#6c757d" text-anchor="middle">W5</text>
  <rect x="346.0" y="122.5" width="33.0" height="72.5" fill="#ff7898" rx="4"/>
  <text x="362.5" y="138.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">58</text>
  <text x="362.5" y="208" font-size="8" fill="#6c757d" text-anchor="middle">W6</text>
  <text x="362.5" y="225" font-size="9" fill="#6c757d" font-style="italic" text-anchor="middle">on-call</text>
  <text x="362.5" y="236" font-size="9" fill="#6c757d" font-style="italic" text-anchor="middle">night</text>
  <rect x="401.0" y="82.5" width="33.0" height="112.5" fill="#06bdad" rx="4"/>
  <text x="417.5" y="98.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">90</text>
  <text x="417.5" y="208" font-size="8" fill="#6c757d" text-anchor="middle">W7</text>
  <rect x="456.0" y="126.2" width="33.0" height="68.8" fill="#ff7898" rx="4"/>
  <text x="472.5" y="142.2" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">55</text>
  <text x="472.5" y="208" font-size="8" fill="#6c757d" text-anchor="middle">W8</text>
  <text x="472.5" y="225" font-size="9" fill="#6c757d" font-style="italic" text-anchor="middle">helped</text>
  <text x="472.5" y="236" font-size="9" fill="#6c757d" font-style="italic" text-anchor="middle">a junior</text>
  <!-- Footer -->
  <text x="260" y="262" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">The dashboard sees 3 bad weeks. It never sees why.</text>
</svg>
