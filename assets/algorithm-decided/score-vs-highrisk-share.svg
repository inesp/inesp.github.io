<svg viewBox="10 0 520 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="300" fill="#fff"/>

  <!-- Title block -->
  <text x="270" y="28" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">What the dashboard score actually tracks</text>
  <text x="270" y="44" font-size="9" fill="#6c757d" text-anchor="middle">the more of your deploys go into high-risk systems, the worse your overall rate</text>

  <!-- Grid lines (subtle) -->
  <line x1="70" y1="216.0" x2="470" y2="216.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="219.0" font-size="8" fill="#6c757d" text-anchor="end">5%</text>
  <line x1="70" y1="182.0" x2="470" y2="182.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="185.0" font-size="8" fill="#6c757d" text-anchor="end">10%</text>
  <line x1="70" y1="148.0" x2="470" y2="148.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="151.0" font-size="8" fill="#6c757d" text-anchor="end">15%</text>
  <line x1="70" y1="114.0" x2="470" y2="114.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="117.0" font-size="8" fill="#6c757d" text-anchor="end">20%</text>
  <line x1="70" y1="80.0" x2="470" y2="80.0" stroke="#dadada" stroke-width="0.5"/>
  <text x="64" y="83.0" font-size="8" fill="#6c757d" text-anchor="end">25%</text>
  <line x1="170.0" y1="250" x2="170.0" y2="80" stroke="#dadada" stroke-width="0.5"/>
  <text x="170.0" y="264" font-size="8" fill="#6c757d" text-anchor="middle">25%</text>
  <line x1="270.0" y1="250" x2="270.0" y2="80" stroke="#dadada" stroke-width="0.5"/>
  <text x="270.0" y="264" font-size="8" fill="#6c757d" text-anchor="middle">50%</text>
  <line x1="370.0" y1="250" x2="370.0" y2="80" stroke="#dadada" stroke-width="0.5"/>
  <text x="370.0" y="264" font-size="8" fill="#6c757d" text-anchor="middle">75%</text>
  <line x1="470.0" y1="250" x2="470.0" y2="80" stroke="#dadada" stroke-width="0.5"/>
  <text x="470.0" y="264" font-size="8" fill="#6c757d" text-anchor="middle">100%</text>

  <!-- Trend line (least squares over all seven engineers) -->
  <line x1="74.0" y1="160.61429293428642" x2="442.0" y2="117" stroke="#6c757d" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <line x1="70" y1="250" x2="470" y2="250" stroke="#212529" stroke-width="1.5"/>
  <polygon points="480,250 470,246 470,254" fill="#212529"/>
  <line x1="70" y1="80" x2="70" y2="250" stroke="#212529" stroke-width="1.5"/>
  <text x="15" y="180.0" font-size="11" fill="#212529" text-anchor="middle" transform="rotate(-90, 15, 165.0)">Overall failure rate</text>
  <text x="270.0" y="285" font-size="11" fill="#212529" text-anchor="middle">Share of deploys that go into high-risk systems</text>

  <!-- One dot per engineer, label sitting right beside its dot; Ana emphasized -->
  <circle cx="80.0" cy="173.5" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="80.0" y="188.0" font-size="9" fill="#6c757d" text-anchor="middle">Nils</text>
  <circle cx="114.4" cy="159.3" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="120.94444444444444" y="170.83333333333331" font-size="9" fill="#6c757d" text-anchor="start">Tomasz</text>
  <circle cx="136.7" cy="155.6" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="144.66666666666666" y="161.55555555555554" font-size="9" fill="#6c757d" text-anchor="start">Chiara</text>
  <circle cx="136.7" cy="148.0" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="136.66666666666666" y="138.5" font-size="9" fill="#6c757d" text-anchor="middle">Greta</text>
  <circle cx="114.4" cy="144.2" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="106.44444444444444" y="147.22222222222223" font-size="9" fill="#6c757d" text-anchor="end">Jonas</text>
  <circle cx="155.7" cy="143.1" r="4" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="163.71428571428572" y="146.14285714285714" font-size="9" fill="#6c757d" text-anchor="start">Matej</text>
  <circle cx="410.0" cy="120.8" r="5" fill="#28a745" stroke="#4a9c6d" stroke-width="1"/>
  <text x="410.0" y="108.80000000000001" font-size="9" fill="#28a745" font-weight="bold" text-anchor="middle">Ana</text>

</svg>
