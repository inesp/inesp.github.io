<svg viewBox="0 0 520 246" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="246" fill="#fff"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 8,4 0,8" fill="#212529"/></marker></defs>
  <text x="260" y="24" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">2 ways our decisions shape the data</text>
  <rect x="10" y="40" width="245" height="196" fill="#fff" rx="4" stroke="#dadada" stroke-width="1.5"/>
  <text x="22" y="60" font-size="11" fill="#212529" font-weight="bold">1. The selective labels problem</text>
  <rect x="265" y="40" width="245" height="196" fill="#fff" rx="4" stroke="#dadada" stroke-width="1.5"/>
  <text x="277" y="60" font-size="11" fill="#212529" font-weight="bold">2. Feedback loops</text>
  <!-- PANEL 1: legend, candidates would turn out great / average / bad -->
  <circle cx="40" cy="76" r="4" fill="#28a745"/>
  <text x="48" y="79" font-size="8" fill="#6c757d">Great</text>
  <circle cx="102" cy="76" r="4" fill="#ffcf65"/>
  <text x="110" y="79" font-size="8" fill="#6c757d">Average</text>
  <circle cx="164" cy="76" r="4" fill="#fd456f"/>
  <text x="172" y="79" font-size="8" fill="#6c757d">Bad</text>
  <!-- our interview splits the candidates, both sides are mixed -->
  <text x="70" y="100" font-size="9" fill="#212529" font-weight="bold" text-anchor="middle">Hired</text>
  <text x="130" y="192" font-size="8" fill="#212529" font-weight="bold" text-anchor="middle">Our interview</text>
  <text x="200" y="100" font-size="9" fill="#212529" font-weight="bold" text-anchor="middle">Rejected</text>
  <line x1="130" y1="92" x2="130" y2="180" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- hired (6): a year later we know how each one turned out -->
  <circle cx="54" cy="138" r="6" fill="#28a745"/>
  <circle cx="70" cy="138" r="6" fill="#ffcf65"/>
  <circle cx="86" cy="138" r="6" fill="#fd456f"/>
  <circle cx="54" cy="154" r="6" fill="#ffcf65"/>
  <circle cx="70" cy="154" r="6" fill="#28a745"/>
  <circle cx="86" cy="154" r="6" fill="#ffcf65"/>
  <!-- rejected (30): they have a true outcome too, we just never see it -->
  <circle cx="160" cy="114" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="160" y="117" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="176" cy="114" r="6" fill="#28a745" opacity="0.3"/>
  <text x="176" y="117" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="192" cy="114" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="192" y="117" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="208" cy="114" r="6" fill="#fd456f" opacity="0.3"/>
  <text x="208" y="117" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="224" cy="114" r="6" fill="#28a745" opacity="0.3"/>
  <text x="224" y="117" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="240" cy="114" r="6" fill="#fd456f" opacity="0.3"/>
  <text x="240" y="117" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="160" cy="130" r="6" fill="#28a745" opacity="0.3"/>
  <text x="160" y="133" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="176" cy="130" r="6" fill="#28a745" opacity="0.3"/>
  <text x="176" y="133" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="192" cy="130" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="192" y="133" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="208" cy="130" r="6" fill="#28a745" opacity="0.3"/>
  <text x="208" y="133" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="224" cy="130" r="6" fill="#fd456f" opacity="0.3"/>
  <text x="224" y="133" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="240" cy="130" r="6" fill="#fd456f" opacity="0.3"/>
  <text x="240" y="133" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="160" cy="146" r="6" fill="#fd456f" opacity="0.3"/>
  <text x="160" y="149" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="176" cy="146" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="176" y="149" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="192" cy="146" r="6" fill="#fd456f" opacity="0.3"/>
  <text x="192" y="149" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="208" cy="146" r="6" fill="#fd456f" opacity="0.3"/>
  <text x="208" y="149" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="224" cy="146" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="224" y="149" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="240" cy="146" r="6" fill="#28a745" opacity="0.3"/>
  <text x="240" y="149" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="160" cy="162" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="160" y="165" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="176" cy="162" r="6" fill="#fd456f" opacity="0.3"/>
  <text x="176" y="165" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
