  <text x="160" y="181" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="176" cy="178" r="6" fill="#28a745" opacity="0.3"/>
  <text x="176" y="181" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="192" cy="178" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="192" y="181" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="208" cy="178" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="208" y="181" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="224" cy="178" r="6" fill="#28a745" opacity="0.3"/>
  <text x="224" y="181" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <circle cx="240" cy="178" r="6" fill="#ffcf65" opacity="0.3"/>
  <text x="240" y="181" font-size="8" fill="#6c757d" font-weight="bold" text-anchor="middle">?</text>
  <text x="70" y="210" font-size="8" fill="#6c757d" text-anchor="middle">We see how they did</text>
  <text x="200" y="210" font-size="8" fill="#6c757d" text-anchor="middle">We never find out</text>
  <text x="132" y="230" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">Our data only knows the people we hired</text>
  <!-- PANEL 2: input -> system -> output, and the output goes back into the input -->
  <line x1="274" y1="113" x2="289" y2="113" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="290" y="96" width="76" height="34" rx="4" fill="#06bdad"/>
  <text x="328.0" y="110" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">Interviewers:</text>
  <text x="328.0" y="122" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">mostly Y</text>
  <line x1="366" y1="113" x2="374" y2="113" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="375" y="96" width="58" height="34" rx="4" fill="#ff7898"/>
  <text x="404" y="110" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">Interview</text>
  <text x="404" y="122" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">fits Y</text>
  <line x1="433" y1="113" x2="441" y2="113" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="442" y="96" width="58" height="34" rx="4" fill="#35b0e8"/>
  <text x="471.0" y="110" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">Hire more</text>
  <text x="471.0" y="122" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">from Y</text>
  <text x="328" y="88" font-size="8" fill="#6c757d" text-anchor="middle">Input</text>
  <text x="404" y="88" font-size="8" fill="#6c757d" text-anchor="middle">System</text>
  <text x="471" y="88" font-size="8" fill="#6c757d" text-anchor="middle">Output</text>
  <!-- the loop back: new hires become the next round of data -->
  <path d="M471 130 V160 Q471 166 465 166 H334 Q328 166 328 160 V133" fill="none" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="400" y="182" font-size="8" fill="#6c757d" text-anchor="middle">New hires become interviewers</text>
  <text x="387" y="230" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">Every round confirms the last one</text>
</svg>
