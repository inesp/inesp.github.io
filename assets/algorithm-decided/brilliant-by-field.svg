  <line x1="184.1" y1="200.0" x2="228.2" y2="200.0" stroke="#dadada" stroke-width="2"/>
  <circle cx="184.1" cy="200.0" r="4.5" fill="#ff7898"/>
  <circle cx="228.2" cy="200.0" r="4.5" fill="#35b0e8"/>
  <text x="444" y="203.0" font-size="9" fill="#6c757d" text-anchor="middle">72%</text>
  <text x="122" y="223.0" font-size="9" fill="#212529" text-anchor="end">Communication</text>
  <line x1="167.7" y1="220.0" x2="205.9" y2="220.0" stroke="#dadada" stroke-width="2"/>
  <circle cx="167.7" cy="220.0" r="4.5" fill="#ff7898"/>
  <circle cx="205.9" cy="220.0" r="4.5" fill="#35b0e8"/>
  <text x="444" y="223.0" font-size="9" fill="#6c757d" text-anchor="middle">64%</text>
  <text x="122" y="243.0" font-size="9" fill="#212529" text-anchor="end">Mathematics</text>
  <line x1="158.6" y1="240.0" x2="198.6" y2="240.0" stroke="#dadada" stroke-width="2"/>
  <circle cx="158.6" cy="240.0" r="4.5" fill="#ff7898"/>
  <circle cx="198.6" cy="240.0" r="4.5" fill="#35b0e8"/>
  <text x="444" y="243.0" font-size="9" fill="#6c757d" text-anchor="middle">29%</text>
