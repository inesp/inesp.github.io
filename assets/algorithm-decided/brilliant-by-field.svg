  <circle cx="380.4" cy="80.0" r="4.5" fill="#35b0e8"/>
  <text x="444" y="83.0" font-size="9" fill="#6c757d" text-anchor="middle">31%</text>
  <text x="122" y="103.0" font-size="9" fill="#212529" text-anchor="end">Political science</text>
  <line x1="307.2" y1="100.0" x2="344.4" y2="100.0" stroke="#dadada" stroke-width="2"/>
  <circle cx="307.2" cy="100.0" r="4.5" fill="#ff7898"/>
  <circle cx="344.4" cy="100.0" r="4.5" fill="#35b0e8"/>
  <text x="444" y="103.0" font-size="9" fill="#6c757d" text-anchor="middle">43%</text>
  <text x="122" y="123.0" font-size="9" fill="#212529" text-anchor="end">English</text>
  <line x1="232.7" y1="120.0" x2="330.1" y2="120.0" stroke="#dadada" stroke-width="2"/>
  <circle cx="232.7" cy="120.0" r="4.5" fill="#ff7898"/>
