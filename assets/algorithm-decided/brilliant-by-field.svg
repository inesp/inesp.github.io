  <circle cx="255.9" cy="160.0" r="4.5" fill="#35b0e8"/>
  <text x="444" y="163.0" font-size="9" fill="#6c757d" text-anchor="middle">20%</text>
  <text x="122" y="183.0" font-size="9" fill="#212529" text-anchor="end">Education</text>
  <line x1="177.4" y1="180.0" x2="239.9" y2="180.0" stroke="#dadada" stroke-width="2"/>
  <circle cx="177.4" cy="180.0" r="4.5" fill="#ff7898"/>
  <circle cx="239.9" cy="180.0" r="4.5" fill="#35b0e8"/>
  <text x="444" y="183.0" font-size="9" fill="#6c757d" text-anchor="middle">69%</text>
