<svg viewBox="0 0 480 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="480" height="310" fill="#fff"/>
  <text x="240" y="26" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">Who gets called "brilliant"?</text>
  <text x="240" y="42" font-size="9" fill="#6c757d" text-anchor="middle">uses per million words in RateMyProfessors reviews (Storage et al., 2016)</text>

  <!-- Legend -->
  <circle cx="134" cy="56" r="4" fill="#ff7898"/><text x="142" y="59" font-size="9" fill="#212529">women professors</text>
  <circle cx="234" cy="56" r="4" fill="#35b0e8"/><text x="242" y="59" font-size="9" fill="#212529">men professors</text>
  <text x="444" y="59" font-size="8" fill="#6c757d" text-anchor="middle">women PhDs</text>

  <!-- Grid lines (subtle) -->
  <line x1="130.0" y1="68" x2="130.0" y2="270" stroke="#dadada" stroke-width="0.5"/>
  <text x="130.0" y="282" font-size="8" fill="#6c757d" text-anchor="middle">0</text>
  <line x1="197.5" y1="68" x2="197.5" y2="270" stroke="#dadada" stroke-width="0.5"/>
  <text x="197.5" y="282" font-size="8" fill="#6c757d" text-anchor="middle">50</text>
  <line x1="265.0" y1="68" x2="265.0" y2="270" stroke="#dadada" stroke-width="0.5"/>
  <text x="265.0" y="282" font-size="8" fill="#6c757d" text-anchor="middle">100</text>
  <line x1="332.5" y1="68" x2="332.5" y2="270" stroke="#dadada" stroke-width="0.5"/>
  <text x="332.5" y="282" font-size="8" fill="#6c757d" text-anchor="middle">150</text>
  <line x1="400.0" y1="68" x2="400.0" y2="270" stroke="#dadada" stroke-width="0.5"/>
  <text x="400.0" y="282" font-size="8" fill="#6c757d" text-anchor="middle">200</text>
