  <line x1="155.8" y1="260.0" x2="196.4" y2="260.0" stroke="#dadada" stroke-width="2"/>
  <circle cx="155.8" cy="260.0" r="4.5" fill="#ff7898"/>
  <circle cx="196.4" cy="260.0" r="4.5" fill="#35b0e8"/>
  <text x="444" y="263.0" font-size="9" fill="#6c757d" text-anchor="middle">19%</text>
  <text x="240.0" y="302" font-size="8" fill="#6c757d" text-anchor="middle">10 of the 18 fields studied; "brilliant" is used 1.8x and "genius" 3.1x more often for men overall</text>
</svg>
