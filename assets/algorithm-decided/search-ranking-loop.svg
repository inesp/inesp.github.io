<svg viewBox="0 0 480 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="480" height="250" fill="#fff"/>
  <text x="240" y="26" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">The ranking eats its own output</text>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" fill="#212529"/></marker></defs>

  <!-- Cycle: four boxes, clockwise -->
  <rect x="160" y="44" width="160" height="42" fill="#06bdad" rx="4"/>
  <text x="240.0" y="69.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Result is on top</text>
  <rect x="300" y="112" width="160" height="42" fill="#35b0e8" rx="4"/>
  <text x="380.0" y="131.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Gets more clicks</text>
  <text x="380.0" y="144.0" font-size="8.5" fill="#fff" text-anchor="middle">because it's on top</text>
  <rect x="160" y="180" width="160" height="42" fill="#ff7898" rx="4"/>
  <text x="240.0" y="199.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Model learns</text>
  <text x="240.0" y="212.0" font-size="8.5" fill="#fff" text-anchor="middle">"people love this result"</text>
  <rect x="20" y="112" width="160" height="42" fill="#fd456f" rx="4"/>
  <text x="100.0" y="137.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Ranked on top again</text>
  <line x1="322" y1="70" x2="375" y2="108" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="375" y1="158" x2="324" y2="196" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="156" y1="200" x2="104" y2="158" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="104" y1="108" x2="156" y2="72" stroke="#212529" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="240" y="140" font-size="10" fill="#6c757d" text-anchor="middle">every week</text>
  <text x="240" y="152" font-size="10" fill="#6c757d" text-anchor="middle">a bit more sure</text>
</svg>
