<svg viewBox="0 0 520 318" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
<rect width="520" height="318" fill="#fff"/>
<defs><marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#212529"/></marker></defs>
<text x="260.0" y="24.0" font-size="14" fill="#212529" font-weight="bold" text-anchor="middle">The crime stays put. The police move.</text>
<!-- Legend -->
<rect x="130" y="38" width="10" height="10" rx="2" fill="#ff7898"/>
<text x="145.0" y="47.0" font-size="10" fill="#212529">neighborhood D</text>
<rect x="245" y="38" width="10" height="10" rx="2" fill="#35b0e8"/>
<text x="260.0" y="47.0" font-size="10" fill="#212529">neighborhood S</text>
<!-- REAL crime: never changes -->
<text x="120.0" y="81.0" font-size="11" fill="#212529" font-weight="bold" text-anchor="end">where the crime is</text>
<rect x="130" y="62" width="220" height="28" rx="4" fill="#35b0e8"/>
<rect x="130" y="62" width="125.4" height="28" rx="4" fill="#ff7898"/>
<rect x="251.4" y="62" width="4" height="28" fill="#ff7898"/>
<text x="138.0" y="81.0" font-size="11" fill="#fff" font-weight="bold">57%</text>
<text x="342.0" y="81.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">43%</text>
<!-- The loop: recorded crime = patrols -->
<text x="130.0" y="116.0" font-size="10" fill="#6c757d" font-weight="bold">what the data says = where the police go</text>
<text x="120.0" y="143.0" font-size="11" fill="#212529" text-anchor="end">day 1</text>
<rect x="130" y="124" width="220" height="28" rx="4" fill="#35b0e8"/>
<rect x="130" y="124" width="136.4" height="28" rx="4" fill="#ff7898"/>
<rect x="262.4" y="124" width="4" height="28" fill="#ff7898"/>
<text x="138.0" y="143.0" font-size="11" fill="#fff" font-weight="bold">62%</text>
<text x="342.0" y="143.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">38%</text>
<text x="120.0" y="213.0" font-size="11" fill="#212529" text-anchor="end">day 500</text>
<rect x="130" y="194" width="220" height="28" rx="4" fill="#35b0e8"/>
<rect x="130" y="194" width="180.4" height="28" rx="4" fill="#ff7898"/>
<rect x="306.4" y="194" width="4" height="28" fill="#ff7898"/>
<text x="138.0" y="213.0" font-size="11" fill="#fff" font-weight="bold">82%</text>
<text x="342.0" y="213.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">18%</text>
<text x="120.0" y="283.0" font-size="11" fill="#212529" text-anchor="end">day 1,000</text>
<rect x="130" y="264" width="220" height="28" rx="4" fill="#35b0e8"/>
<rect x="130" y="264" width="209.0" height="28" rx="4" fill="#ff7898"/>
<rect x="335.0" y="264" width="4" height="28" fill="#ff7898"/>
<text x="138.0" y="283.0" font-size="11" fill="#fff" font-weight="bold">95%</text>
<text x="355.0" y="283.0" font-size="11" fill="#35b0e8" font-weight="bold">5%</text>
<line x1="146" y1="155" x2="146" y2="190" stroke="#212529" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="156.0" y="176.5" font-size="10" fill="#6c757d">police only record crime where they are, so the data says D is dangerous</text>
<line x1="146" y1="225" x2="146" y2="260" stroke="#212529" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="156.0" y="246.5" font-size="10" fill="#6c757d">so next time they send even more patrols to D</text>
<text x="512.0" y="312.0" font-size="8" fill="#6c757d" text-anchor="end">Re-run of the urn model from Ensign et al. (2018) on Oakland data, median of 300 runs</text>
</svg>
