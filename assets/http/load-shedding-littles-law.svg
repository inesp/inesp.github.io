<svg viewBox="0 0 520 156" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="156" fill="#fff"/>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#212529"/></marker></defs>

  <!-- Workers (right) draining the queue -->
  <rect x="428" y="40" width="72" height="36" fill="#d4edda" rx="4" stroke="#4a9c6d" stroke-width="1.5"/>
  <text x="464" y="62" font-size="10" fill="#212529" font-weight="bold" text-anchor="middle">Workers</text>
  <text x="464" y="32" font-size="9" fill="#4a9c6d" font-weight="bold" text-anchor="middle">finish 2.5 / s</text>
  <line x1="409" y1="58" x2="424" y2="58" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- The queue: tiny tasks, with a gap to suggest 63,000 of them -->
  <rect x="391" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="377" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="363" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="349" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="335" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="321" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="307" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="293" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="279" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="265" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <text x="248" y="62" font-size="12" fill="#6c757d" text-anchor="middle">...</text>
  <rect x="221" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="207" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="193" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="179" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="165" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="151" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="137" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="123" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="109" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>
  <rect x="95" y="52" width="11" height="11" fill="#f0f0f0" rx="1.5" stroke="#9f9f9f" stroke-width="0.8"/>

  <!-- You (left), joining at the back -->
  <rect x="57" y="46" width="24" height="24" fill="#ffed50" rx="3" stroke="#e7d749" stroke-width="1.5"/>
  <text x="69" y="32" font-size="9" fill="#212529" font-weight="bold" text-anchor="middle">you,</text>
  <text x="69" y="42" font-size="9" fill="#212529" font-weight="bold" text-anchor="middle">joining now</text>

  <!-- Bracket: how many are ahead of you -->
  <line x1="95" y1="86" x2="402" y2="86" stroke="#9f9f9f" stroke-width="1"/>
  <line x1="95" y1="82" x2="95" y2="86" stroke="#9f9f9f" stroke-width="1"/>
  <line x1="402" y1="82" x2="402" y2="86" stroke="#9f9f9f" stroke-width="1"/>
  <text x="248.5" y="100" font-size="10" fill="#6c757d" text-anchor="middle">63,000 tasks ahead of you</text>

  <!-- The calculation -->
  <text x="330" y="140" font-size="12" fill="#212529" text-anchor="end">63,000 ÷ 2.5 per second = 25,200 s ≈</text>
  <text x="336" y="140" font-size="12" fill="#fd456f" font-weight="bold">7 hours</text>
</svg>
