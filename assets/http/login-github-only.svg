<svg viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="380" height="240" fill="#fff"/>

  <!-- Title -->
  <text x="190" y="22" text-anchor="middle" font-size="11" fill="#212529" font-weight="bold">The only way to log in</text>

  <!-- Browser window frame -->
  <rect x="50" y="42" width="280" height="165" rx="4" fill="none" stroke="#212529" stroke-width="1.5"/>

  <!-- Titlebar: GNOME-style, controls on the right -->
  <path d="M50 46 a4 4 0 0 1 4 -4 h272 a4 4 0 0 1 4 4 v20 h-280 z" fill="#fff283"/>
  <line x1="50" y1="66" x2="330" y2="66" stroke="#e7d749" stroke-width="1.5"/>
  <text x="62" y="58" font-size="10" fill="#212529">my-app.com</text>
  <!-- minimize / maximize / close -->
  <line x1="286" y1="54" x2="294" y2="54" stroke="#212529" stroke-width="1.2"/>
  <rect x="300" y="50" width="8" height="8" fill="none" stroke="#212529" stroke-width="1.2"/>
  <line x1="314" y1="50" x2="322" y2="58" stroke="#212529" stroke-width="1.2"/>
  <line x1="322" y1="50" x2="314" y2="58" stroke="#212529" stroke-width="1.2"/>

  <!-- Login card heading -->
  <text x="190" y="100" text-anchor="middle" font-size="12" fill="#212529" font-weight="bold">Sign in</text>

  <!-- GitHub button -->
  <rect x="105" y="118" width="170" height="34" rx="4" fill="#212529"/>
  <g transform="translate(124, 127) scale(1.05)">
    <path fill="#fff" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
  </g>
  <text x="205" y="140" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Continue with GitHub</text>

  <!-- The absence, stated -->
  <text x="190" y="176" text-anchor="middle" font-size="10" fill="#e6a000" font-weight="bold">&lt;no email, no password&gt;</text>
</svg>
