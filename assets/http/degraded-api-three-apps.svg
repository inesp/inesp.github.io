<svg viewBox="0 0 540 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="540" height="300" fill="#fff"/>

  <!-- The shared cause -->
  <text x="270.0" y="20" text-anchor="middle" font-size="11" fill="#212529" font-weight="bold">GitHub&#8217;s API is degraded. How does your app handle this?</text>
  <rect x="92" y="30" width="30" height="15" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="107.0" y="41" text-anchor="middle" font-size="7.5" fill="#fd456f" font-weight="bold">500</text>
  <rect x="127" y="30" width="46" height="15" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="150.0" y="41" text-anchor="middle" font-size="7.5" fill="#fd456f" font-weight="bold">timeout</text>
  <rect x="178" y="30" width="30" height="15" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="193.0" y="41" text-anchor="middle" font-size="7.5" fill="#fd456f" font-weight="bold">500</text>
  <rect x="213" y="30" width="46" height="15" rx="2" fill="#d4edda" stroke="#4a9c6d" stroke-width="1"/>
  <text x="236.0" y="41" text-anchor="middle" font-size="7.5" fill="#4a9c6d" font-weight="bold">200</text>
  <rect x="264" y="30" width="46" height="15" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="287.0" y="41" text-anchor="middle" font-size="7.5" fill="#fd456f" font-weight="bold">timeout</text>
  <rect x="315" y="30" width="30" height="15" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="330.0" y="41" text-anchor="middle" font-size="7.5" fill="#fd456f" font-weight="bold">500</text>
  <rect x="350" y="30" width="46" height="15" rx="2" fill="#d4edda" stroke="#4a9c6d" stroke-width="1"/>
  <text x="373.0" y="41" text-anchor="middle" font-size="7.5" fill="#4a9c6d" font-weight="bold">200</text>
  <rect x="401" y="30" width="30" height="15" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="416.0" y="41" text-anchor="middle" font-size="7.5" fill="#fd456f" font-weight="bold">500</text>
  <!-- 1. No handling of non-200: the page itself dies -->
  <!-- window frame -->
  <rect x="20" y="56" width="150" height="150" rx="4" fill="none" stroke="#212529" stroke-width="1.5"/>
  <path d="M20 60 a4 4 0 0 1 4 -4 h142 a4 4 0 0 1 4 4 v14 h-150 z" fill="#fff283"/>
  <line x1="20" y1="74" x2="170" y2="74" stroke="#e7d749" stroke-width="1.5"/>
  <text x="27" y="69" font-size="7.5" fill="#212529">my-app.com</text>
  <line x1="134" y1="66" x2="140" y2="66" stroke="#212529" stroke-width="1"/>
  <rect x="145" y="63" width="6" height="6" fill="none" stroke="#212529" stroke-width="1"/>
  <line x1="156" y1="63" x2="162" y2="69" stroke="#212529" stroke-width="1"/>
  <line x1="162" y1="63" x2="156" y2="69" stroke="#212529" stroke-width="1"/>

  <!-- only the home page is on fire -->
  <rect x="21" y="74" width="148" height="90" fill="#ffe6e6"/>
  <text x="95.0" y="114" text-anchor="middle" font-size="26" fill="#fd456f" font-weight="bold">500</text>
  <text x="95.0" y="132" text-anchor="middle" font-size="8.5" fill="#fd456f">Internal Server Error</text>
  <text x="95.0" y="150" text-anchor="middle" font-size="7" fill="#6c757d" font-family="monospace">JSONDecodeError</text>
  <line x1="21" y1="164" x2="169" y2="164" stroke="#dadada" stroke-width="1"/>
  <!-- ...but the rest of the app is untouched -->
  <circle cx="44" cy="180" r="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <path d="M41.5 180 l2 2 l3.5 -4" fill="none" stroke="#28a745" stroke-width="1.2"/>
  <text x="54" y="183" font-size="8" fill="#28a745" font-weight="bold">every other page is fine</text>
  <text x="95.0" y="197" text-anchor="middle" font-size="7.5" fill="#6c757d">/settings  /billing  /login</text>

  <text x="95.0" y="230" text-anchor="middle" font-size="10" fill="#000" font-weight="bold">1. Home page breaks</text>
  <text x="95.0" y="244" text-anchor="middle" font-size="8" fill="#6c757d">Other pages still work,</text>
    <text x="95.0" y="256" text-anchor="middle" font-size="8" fill="#6c757d">we forgot to handle non-200 responses.</text>
  <!-- 2. Requests outlive the refresh interval and stack -->
  <!-- window frame -->
  <rect x="195" y="56" width="150" height="150" rx="4" fill="none" stroke="#212529" stroke-width="1.5"/>
  <path d="M195 60 a4 4 0 0 1 4 -4 h142 a4 4 0 0 1 4 4 v14 h-150 z" fill="#fff283"/>
  <line x1="195" y1="74" x2="345" y2="74" stroke="#e7d749" stroke-width="1.5"/>
  <text x="202" y="69" font-size="7.5" fill="#212529">my-app.com</text>
  <line x1="309" y1="66" x2="315" y2="66" stroke="#212529" stroke-width="1"/>
  <rect x="320" y="63" width="6" height="6" fill="none" stroke="#212529" stroke-width="1"/>
  <line x1="331" y1="63" x2="337" y2="69" stroke="#212529" stroke-width="1"/>
  <line x1="337" y1="63" x2="331" y2="69" stroke="#212529" stroke-width="1"/>
  <rect x="217" y="86" width="92" height="12" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="263" y="94.5" text-anchor="middle" font-size="7" fill="#000">GET /pulls  &#8230;pending</text>
  <rect x="221" y="99" width="92" height="12" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="267" y="107.5" text-anchor="middle" font-size="7" fill="#000">GET /pulls  &#8230;pending</text>
  <rect x="225" y="112" width="92" height="12" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="271" y="120.5" text-anchor="middle" font-size="7" fill="#000">GET /pulls  &#8230;pending</text>
  <rect x="229" y="125" width="92" height="12" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="275" y="133.5" text-anchor="middle" font-size="7" fill="#000">GET /pulls  &#8230;pending</text>
  <rect x="233" y="138" width="92" height="12" rx="2" fill="#ffe6e6" stroke="#fd456f" stroke-width="1"/>
  <text x="279" y="146.5" text-anchor="middle" font-size="7" fill="#000">GET /pulls  &#8230;pending</text>

  <text x="270.0" y="162" text-anchor="middle" font-size="7.5" fill="#6c757d">&#8230;</text>
  <line x1="213" y1="170" x2="327" y2="170" stroke="#dadada" stroke-width="0.5"/>
  <text x="270.0" y="190" text-anchor="middle" font-size="8" fill="#fd456f" font-weight="bold">All workers are busy with GitHub</text>

  <text x="270.0" y="230" text-anchor="middle" font-size="10" fill="#000" font-weight="bold">2. The whole app breaks</text>
  <text x="270.0" y="244" text-anchor="middle" font-size="8" fill="#6c757d">Even pages that never call GitHub</text>
  <!-- 3. try/except -> return []  -> a confident, wrong zero -->
  <!-- window frame -->
  <rect x="370" y="56" width="150" height="150" rx="4" fill="none" stroke="#212529" stroke-width="1.5"/>
  <path d="M370 60 a4 4 0 0 1 4 -4 h142 a4 4 0 0 1 4 4 v14 h-150 z" fill="#fff283"/>
  <line x1="370" y1="74" x2="520" y2="74" stroke="#e7d749" stroke-width="1.5"/>
  <text x="377" y="69" font-size="7.5" fill="#212529">my-app.com</text>
  <line x1="484" y1="66" x2="490" y2="66" stroke="#212529" stroke-width="1"/>
  <rect x="495" y="63" width="6" height="6" fill="none" stroke="#212529" stroke-width="1"/>
  <line x1="506" y1="63" x2="512" y2="69" stroke="#212529" stroke-width="1"/>
  <line x1="512" y1="63" x2="506" y2="69" stroke="#212529" stroke-width="1"/>

  <text x="445.0" y="92" text-anchor="middle" font-size="8" fill="#6c757d">Open pull requests</text>
  <text x="445.0" y="130" text-anchor="middle" font-size="30" fill="#212529" font-weight="bold">0</text>
  <!-- an honest-looking little chart, flat on the floor -->
  <line x1="398" y1="160" x2="492" y2="160" stroke="#dadada" stroke-width="0.5"/>
  <line x1="398" y1="148" x2="492" y2="148" stroke="#dadada" stroke-width="0.5"/>
  <rect x="402" y="158" width="9" height="2" fill="#ffed50" stroke="#e7d749" stroke-width="0.5"/>
  <rect x="417" y="158" width="9" height="2" fill="#ffed50" stroke="#e7d749" stroke-width="0.5"/>
  <rect x="432" y="158" width="9" height="2" fill="#ffed50" stroke="#e7d749" stroke-width="0.5"/>
  <rect x="447" y="158" width="9" height="2" fill="#ffed50" stroke="#e7d749" stroke-width="0.5"/>
  <rect x="462" y="158" width="9" height="2" fill="#ffed50" stroke="#e7d749" stroke-width="0.5"/>
  <rect x="477" y="158" width="9" height="2" fill="#ffed50" stroke="#e7d749" stroke-width="0.5"/>
  <rect x="492" y="158" width="9" height="2" fill="#ffed50" stroke="#e7d749" stroke-width="0.5"/>

  <circle cx="422" cy="172" r="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <path d="M419.5 172 l2 2 l3.5 -4" fill="none" stroke="#28a745" stroke-width="1.2"/>
  <text x="432" y="175" font-size="7.5" fill="#28a745">updated 12s ago</text>
  <!-- ...except it wasn't, and not everyone sees the same thing -->
  <text x="445.0" y="190" text-anchor="middle" font-size="8" fill="#fd456f" font-weight="bold">&#8593; a lie, nothing was updated</text>

  <text x="445.0" y="230" text-anchor="middle" font-size="10" fill="#212529" font-weight="bold">3. Nothing breaks</text>
  <text x="445.0" y="244" text-anchor="middle" font-size="8" fill="#6c757d">We just show a wrong number</text>
</svg>
