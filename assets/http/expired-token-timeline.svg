  <!-- Quiet period: no calls -->
  <rect x="276" y="94" width="140" height="22" fill="#f0f0f0" rx="4"/>
  <text x="346.0" y="109" font-size="9" fill="#6c757d" text-anchor="middle">no calls at all</text>

  <!-- Events (markers on the axis) -->
  <circle cx="80.0" cy="120.0" r="5" fill="#fd456f" stroke="#fff" stroke-width="1.5"/>
  <line x1="80" y1="90" x2="80" y2="72" stroke="#fd456f" stroke-width="1"/>
  <text x="80" y="54" font-size="10" fill="#fd456f" font-weight="bold" text-anchor="middle">token dies</text>
  <text x="80" y="66" font-size="9" fill="#6c757d" text-anchor="middle">the person who set it up left</text>
  <circle cx="250.0" cy="120.0" r="5" fill="#fd456f" stroke="#fff" stroke-width="1.5"/>
  <line x1="250" y1="128" x2="250" y2="160" stroke="#fd456f" stroke-width="1"/>
  <text x="250" y="174" font-size="10" fill="#fd456f" font-weight="bold" text-anchor="middle">enough proof?</text>
  <text x="250" y="186" font-size="9" fill="#6c757d" text-anchor="middle">is it really dead?</text>
  <circle cx="272.0" cy="120.0" r="5" fill="#fd456f" stroke="#fff" stroke-width="1.5"/>
  <line x1="272" y1="90" x2="272" y2="72" stroke="#fd456f" stroke-width="1"/>
  <text x="272" y="54" font-size="10" fill="#fd456f" font-weight="bold" text-anchor="middle">features locked</text>
  <text x="272" y="66" font-size="9" fill="#6c757d" text-anchor="middle">+ the customer is told</text>
  <circle cx="420.0" cy="120.0" r="5" fill="#28a745" stroke="#fff" stroke-width="1.5"/>
  <line x1="420" y1="90" x2="420" y2="72" stroke="#28a745" stroke-width="1"/>
  <text x="420" y="54" font-size="10" fill="#28a745" font-weight="bold" text-anchor="middle">token fixed</text>
  <text x="420" y="66" font-size="9" fill="#6c757d" text-anchor="middle">the customer reconnects</text>

  <!-- Bracket: the 2 days of proof -->
  <line x1="80" y1="134" x2="236" y2="134" stroke="#fd456f" stroke-width="1"/>
  <line x1="80" y1="130" x2="80" y2="134" stroke="#fd456f" stroke-width="1"/>
  <line x1="236" y1="130" x2="236" y2="134" stroke="#fd456f" stroke-width="1"/>
  <text x="158.0" y="148" font-size="9" fill="#fd456f" font-weight="bold" text-anchor="middle">failing calls, over and over</text>
  <text x="158.0" y="160" font-size="9" fill="#6c757d" text-anchor="middle">the price of collecting proof</text>

  <!-- Bracket: back to normal -->
  <text x="465.0" y="148" font-size="9" fill="#28a745" font-weight="bold" text-anchor="middle">features unlocked,</text>
  <text x="465.0" y="160" font-size="9" fill="#6c757d" text-anchor="middle">calls resume</text>
