<svg viewBox="0 0 520 262" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="520" height="262" fill="#fff"/>

  <!-- Dashboard panel -->
  <rect x="20" y="10" width="480" height="242" fill="#fff" rx="5" stroke="#dadada" stroke-width="1"/>
  <text x="34" y="32" font-size="11" fill="#212529" font-weight="bold">Expired tasks per task name</text>
  <text x="486" y="32" font-size="9" fill="#6c757d" text-anchor="end">last 7 days</text>
  <line x1="20" y1="42" x2="500" y2="42" stroke="#dadada" stroke-width="1"/>

  <!-- Row: fetch_metrics -->
  <text x="34" y="88" font-size="10" fill="#212529" font-family="monospace">fetch_metrics</text>
  <line x1="156" y1="96" x2="367" y2="96" stroke="#dadada" stroke-width="1"/>
  <rect x="250" y="62.0" width="23" height="34.0" fill="#ffed50" rx="2" stroke="#e7d749" stroke-width="1"/>
  <text x="261.5" y="59.0" font-size="8" fill="#6c757d" text-anchor="middle">1,840</text>
  <text x="378" y="78" font-size="9" fill="#28a745" font-weight="bold">incident:</text>
  <text x="378" y="90" font-size="9" fill="#28a745" font-weight="bold">shedding works</text>

  <!-- Row: send_daily_report -->
  <text x="34" y="148" font-size="10" fill="#212529" font-family="monospace">send_daily_report</text>
  <line x1="156" y1="156" x2="367" y2="156" stroke="#dadada" stroke-width="1"/>
  <text x="378" y="138" font-size="9" fill="#6c757d" font-weight="bold">nothing expires,</text>
  <text x="378" y="150" font-size="9" fill="#6c757d" font-weight="bold">all good</text>

  <!-- Row: sync_tickets -->
  <text x="34" y="208" font-size="10" fill="#212529" font-family="monospace">sync_tickets</text>
  <line x1="156" y1="216" x2="367" y2="216" stroke="#dadada" stroke-width="1"/>
  <rect x="160" y="182.0" width="23" height="34.0" fill="#ffed50" rx="2" stroke="#e7d749" stroke-width="1"/>
  <text x="171.5" y="179.0" font-size="8" fill="#6c757d" text-anchor="middle">12</text>
  <rect x="190" y="184.83333333333334" width="23" height="31.166666666666664" fill="#ffed50" rx="2" stroke="#e7d749" stroke-width="1"/>
  <text x="201.5" y="181.83333333333334" font-size="8" fill="#6c757d" text-anchor="middle">11</text>
  <rect x="220" y="182.0" width="23" height="34.0" fill="#ffed50" rx="2" stroke="#e7d749" stroke-width="1"/>
  <text x="231.5" y="179.0" font-size="8" fill="#6c757d" text-anchor="middle">12</text>
  <rect x="250" y="182.0" width="23" height="34.0" fill="#ffed50" rx="2" stroke="#e7d749" stroke-width="1"/>
  <text x="261.5" y="179.0" font-size="8" fill="#6c757d" text-anchor="middle">12</text>
  <rect x="280" y="184.83333333333334" width="23" height="31.166666666666664" fill="#ffed50" rx="2" stroke="#e7d749" stroke-width="1"/>
  <text x="291.5" y="181.83333333333334" font-size="8" fill="#6c757d" text-anchor="middle">11</text>
  <rect x="310" y="182.0" width="23" height="34.0" fill="#ffed50" rx="2" stroke="#e7d749" stroke-width="1"/>
  <text x="321.5" y="179.0" font-size="8" fill="#6c757d" text-anchor="middle">12</text>
  <rect x="340" y="182.0" width="23" height="34.0" fill="#ffed50" rx="2" stroke="#e7d749" stroke-width="1"/>
  <text x="351.5" y="179.0" font-size="8" fill="#6c757d" text-anchor="middle">12</text>
  <text x="378" y="198" font-size="9" fill="#fd456f" font-weight="bold">every day, but no</text>
  <text x="378" y="210" font-size="9" fill="#fd456f" font-weight="bold">incident: suspicious</text>

  <!-- Day labels -->
  <text x="171.5" y="230" font-size="8" fill="#6c757d" text-anchor="middle">Mon</text>
  <text x="201.5" y="230" font-size="8" fill="#6c757d" text-anchor="middle">Tue</text>
  <text x="231.5" y="230" font-size="8" fill="#6c757d" text-anchor="middle">Wed</text>
  <text x="261.5" y="230" font-size="8" fill="#6c757d" text-anchor="middle">Thu</text>
  <text x="291.5" y="230" font-size="8" fill="#6c757d" text-anchor="middle">Fri</text>
  <text x="321.5" y="230" font-size="8" fill="#6c757d" text-anchor="middle">Sat</text>
  <text x="351.5" y="230" font-size="8" fill="#6c757d" text-anchor="middle">Sun</text>
  <text x="34" y="243" font-size="8" fill="#6c757d">each row on its own scale</text>
</svg>
