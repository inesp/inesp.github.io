<svg viewBox="0 0 380 250" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="380" height="250" fill="#fff"/>

  <!-- window frame -->
  <rect x="50" y="42" width="280" height="168" rx="4" fill="none" stroke="#212529" stroke-width="1.5"/>
  <path d="M50 46 a4 4 0 0 1 4 -4 h272 a4 4 0 0 1 4 4 v20 h-280 z" fill="#fff283"/>
  <line x1="50" y1="66" x2="330" y2="66" stroke="#e7d749" stroke-width="1.5"/>
  <text x="62" y="58" font-size="10" fill="#212529">my-app.com</text>
  <line x1="288" y1="54" x2="296" y2="54" stroke="#212529" stroke-width="1.2"/>
  <rect x="302" y="50" width="8" height="8" fill="none" stroke="#212529" stroke-width="1.2"/>
  <line x1="316" y1="50" x2="324" y2="58" stroke="#212529" stroke-width="1.2"/>
  <line x1="324" y1="50" x2="316" y2="58" stroke="#212529" stroke-width="1.2"/>

  <!-- the metric -->
  <text x="190.0" y="86" text-anchor="middle" font-size="9" fill="#6c757d">Open pull requests</text>
  <text x="190.0" y="124" text-anchor="middle" font-size="32" fill="#212529" font-weight="bold">7</text>

  <!-- grid -->
  <line x1="82.0" y1="138" x2="298.0" y2="138" stroke="#dadada" stroke-width="0.5"/>
  <line x1="82.0" y1="174" x2="298.0" y2="174" stroke="#dadada" stroke-width="0.5"/>
  <!-- last 7 refreshes, real numbers -->
  <rect x="90.0" y="154.0" width="20" height="20.0" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="100.0" y="150.0" text-anchor="middle" font-size="7" fill="#6c757d">5</text>
  <text x="100.0" y="184.0" text-anchor="middle" font-size="7" fill="#6c757d">Mon</text>
  <rect x="120.0" y="142.0" width="20" height="32.0" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="130.0" y="138.0" text-anchor="middle" font-size="7" fill="#6c757d">8</text>
  <text x="130.0" y="184.0" text-anchor="middle" font-size="7" fill="#6c757d">Tue</text>
  <rect x="150.0" y="150.0" width="20" height="24.0" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="160.0" y="146.0" text-anchor="middle" font-size="7" fill="#6c757d">6</text>
  <text x="160.0" y="184.0" text-anchor="middle" font-size="7" fill="#6c757d">Wed</text>
  <rect x="180.0" y="138.0" width="20" height="36.0" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="190.0" y="134.0" text-anchor="middle" font-size="7" fill="#6c757d">9</text>
  <text x="190.0" y="184.0" text-anchor="middle" font-size="7" fill="#6c757d">Thu</text>
  <rect x="210.0" y="146.0" width="20" height="28.0" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="220.0" y="142.0" text-anchor="middle" font-size="7" fill="#6c757d">7</text>
  <text x="220.0" y="184.0" text-anchor="middle" font-size="7" fill="#6c757d">Fri</text>
  <rect x="240.0" y="158.0" width="20" height="16.0" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="250.0" y="154.0" text-anchor="middle" font-size="7" fill="#6c757d">4</text>
  <text x="250.0" y="184.0" text-anchor="middle" font-size="7" fill="#6c757d">Sat</text>
  <rect x="270.0" y="146.0" width="20" height="28.0" fill="#ffed50" stroke="#e7d749" stroke-width="1"/>
  <text x="280.0" y="142.0" text-anchor="middle" font-size="7" fill="#6c757d">7</text>
  <text x="280.0" y="184.0" text-anchor="middle" font-size="7" fill="#6c757d">Sun</text>

  <!-- and it is actually true -->
  <circle cx="168.0" cy="195" r="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <path d="M165.5 195 l2 2 l3.5 -4" fill="none" stroke="#28a745" stroke-width="1.2"/>
  <text x="178.0" y="198" font-size="8" fill="#28a745">updated 12s ago</text>
  <text x="190.0" y="238" text-anchor="middle" font-size="9" fill="#6c757d">A real number, and everybody sees the same one.</text>
