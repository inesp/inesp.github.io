# Everything about a talk lives here: the title, the pitch, the long abstract, and
# which writing it draws on. The page at /talk/<key>/ is generated from this file
# by _plugins/talk_pages.rb, so there is no file to create per talk.
#
#   key          stable id, also the URL: /talk/<key>/
#   title        the one title of the talk (no subtitles)
#   description  the short pitch, shown on the /talks/ cards
#   abstract     optional longer text for the talk's own page (markdown)
#   series       optional series name, as in _data/topics.yml
#   post_slugs   optional list of post slugs
#
# series + post_slugs are where the reference list comes from: every source cited
# by any of that writing, deduplicated.

- key: data-lies
  title: How We Lie to Each Other with Data
  series: "The Algorithm Decided"
  description: "Of course, we learned statistics. We went to university, there was a course, there was an exam, we passed it. But we don't really use it at work... when writing code, except.... that we love **proving a point with a good chart**. That would be a harmless quirk if we were bakers, but our code now decides **who gets a loan**, whose claim gets approved, when the doctor sees you. Software engineers have somehow become some of the **most consequential decision-makers in society**, and we cope with it by pretending we're just typing."
  abstract: |
    Of course, we learned statistics. We went to university, there was a course, there was an exam, we passed it. 
    
    But we don't really use it at work... when writing code, except.... that we love **proving a point with a good chart**. That would be a harmless quirk if we were bakers, but our code now decides **who gets a loan**, whose claim gets approved, when the doctor sees you. 
    
    Software engineers have somehow become some of the **most consequential decision-makers in society**, and we cope with it by pretending we're just typing."

- key: tests
  title: How Many Tests Is Enough?
  description: "What makes us really calm when deploying code to production? A green test suite with **100% test coverage**. But then we merge, deploy, go to lunch... and somewhere out there a user does something so creative that **production goes down anyway**. There's no amount of tests that makes the bugs go away. We wish test coverage was a magic number, just like we want to believe in the power of other metrics (LOC, story points, DORA, ...). This talk grapples with two questions: **what our tests actually catch**, and why we keep reaching for these numbers."

- key: estimation
  title: Software Estimation Is a Delusion
  post_slugs:
    - estimation-is-a-delusion
  description: Software estimation has turned into **ritualized guessing**. We are pushed to estimate, but **nobody is teaching us how** to do it. Our estimates are deemed crucial, but the project's specs keep changing mid-work. It's time we abandoned long-term estimates and focus instead on **managing project risks**.
  abstract: |
    Software estimation has turned into **ritualized guessing**. 
    
    We are pushed to estimate, but then we aren't believed when we give high numbers.
    
    **It has been known since the 70s that developers tend to give very optimistic estimations.** We give tight numbers because a small range makes us look knowledgeable, and managers ask because a number, any number, feels like control.

    **So I've come to think estimation was never really a maths problem. It's a social one.**

    Unfortunately, I'm not offering a magic formula. I'm offering language on how to push back on false precision, and how to plan better: not answer "how long will this take?" but "what can we actually build with the time and the resources we have?".


- key: nobody-cares
  title: Nobody Cares What You Built
  description: There's an entire field dedicated to **getting people to read what you write**, developers just aren't in it. We're trained in precision and completeness. Marketers know people only skim, they **decide in 3 seconds**, and only care about what's relevant to them. This talk steals their tricks for **standups, PRs, proposals**, and that email nobody answered.

- key: deploy-impact
  title: "Did My Deploy Degrade Production? Detecting Bad Deploys with Math, Not AI"
  post_slugs:
    - impact-of-a-deploy
  description: When you deploy some code, do you know its **impact on your production stats**, like memory usage, request duration, error rates? If you wanted to know if your code improved or deteriorated the speed of SQL queries, would you know where to get this data? In this talk, I walk through a real-world system we built to **automatically detect pattern changes** to metrics without having to set thresholds manually. (And with **no LLMs**.)

- key: cognitive-biases
  title: Why Smart Developers Write Silly Code
  series: Cognitive Biases in Code
  description: Knowing about cognitive biases is like **debugging our brain**. Devs spend tons of time fixing bugs in code, but biases are **the mental bugs** that mess with our decisions. They make us overconfident, they make us ignore users and fight for bad ideas. But it needn't be this way.

- key: api-resilience
  title: "Their API Went Down. So Why Is My App on Fire?"
  series: API Resilience Patterns
  post_slugs:
    - self-documented-code-part-II
  description: Every API is doing its own thing. Authorization, headers, rate limiting (devs are creative people, so we just like to invent our own rules). After integrating **40+ APIs into the same product**, I have a lot to say about **handling failures of remote APIs**.
  abstract: |
    Third-party APIs are fickle and entirely out of your control. Sooner or later they will have an incident. Will your app survive their outage? Or will they drag you down with them?
